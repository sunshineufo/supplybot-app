<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Supplybot">
<title>Supplybot</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #0f172a; }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: #0f172a; transition: opacity .4s; z-index: 2; }
  #wait.gone { opacity: 0; pointer-events: none; }
  .logo { font-size: 30px; font-weight: 800; letter-spacing: .02em; }
  .logo b { color: #94ba65; }
  .spin { width: 42px; height: 42px; margin: 18px auto; border-radius: 50%; border: 4px solid rgba(148, 186, 101, .25); border-top-color: #94ba65; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #help { display: none; max-width: 360px; }
  #help.on { display: block; }
  #help p { color: #cbd5e1; margin: 10px 0 18px; }
  #help a { display: inline-block; padding: 14px 26px; border-radius: 14px; background: #94ba65; color: #0f172a; font-weight: 800; text-decoration: none; }
</style>
</head>
<body>
<div id="wait">
  <div>
    <div class="logo">⚡ <b>Supply</b>bot</div>
    <div class="spin" id="spin"></div>
    <div id="help">
      <p>Supplybot is taking a while to open here. This usually means your browser wants you to sign in to Google first, which works best on Google's own page.</p>
      <a id="open" target="_top" rel="noopener">Open Supplybot</a>
    </div>
  </div>
</div>
<iframe id="app" title="Supplybot"
  allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; display-capture; web-share; autoplay"
  allowfullscreen></iframe>
<script>
  /* ✏️ Paste your Supplybot web app address here: Apps Script → Deploy → Manage deployments → the Web app URL (it ends in /exec) */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyT16dSQC9gSsHfPon0lcniHOdX9NKFR-bHolk-AsNem2henJq6jJIrfNTzv7OXNFSo/exec';

  var app = document.getElementById('app'), wait = document.getElementById('wait'), ready = false, go = APP_URL + (location.search || '');   /* links like ?setup=1 or ?order=… are passed through */
  document.getElementById('open').href = go;
  /* 📱 iPhone, iPad (every browser there) and Safari on a Mac block your Google sign-in inside another website's frame, so Google
     answers "401". There, Supplybot opens directly instead (your sign-in works); everywhere else it opens inside this page. */
  var ua = navigator.userAgent, apple = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
    || (/Safari/.test(ua) && !/Chrome|Chromium|CriOS|FxiOS|Edg|OPR|Android/.test(ua));
  if (apple) location.replace(go);
  else app.src = go;
  /* Supplybot says "ready" once it has opened inside this page */
  window.addEventListener('message', function (e) {
    if (!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
    if (e.data && e.data.supplybot === 'ready') { ready = true; wait.classList.add('gone'); }
  });
  /* not open after 9 seconds (usually Google sign-in, which can't show inside another site): offer to open it directly */
  setTimeout(function () { if (ready) return; document.getElementById('spin').style.display = 'none'; document.getElementById('help').classList.add('on'); }, 9000);
</script>
</body>
</html>
