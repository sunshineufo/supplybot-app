<!-- 🔖 Supplybot on the browser tab (and a picture version for Safari and the iPhone home screen, made when the page opens) -->
<link id="ico" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%22-80 -40 460 532%22><rect x=%22-80%22 y=%22-40%22 width=%22460%22 height=%22532%22 rx=%22110%22 fill=%22%230f172a%22/><g fill=%22%23e2e8f0%22> <rect x=%2285%22 y=%223%22 width=%2225%22 height=%2272%22 rx=%2212.5%22/><rect x=%22190%22 y=%223%22 width=%2225%22 height=%2272%22 rx=%2212.5%22/> <rect x=%2218%22 y=%2265%22 width=%22264%22 height=%22207%22 rx=%2270%22/> <rect fill=%22%230f172a%22 x=%2253%22 y=%22105%22 width=%22194%22 height=%22127%22 rx=%2240%22/> <circle fill=%22%2394ba65%22 cx=%22110%22 cy=%22162%22 r=%2220%22/><circle fill=%22%2394ba65%22 cx=%22190%22 cy=%22162%22 r=%2220%22/> <path fill=%22none%22 stroke=%22%2394ba65%22 stroke-width=%2213%22 stroke-linecap=%22round%22 d=%22M118 198Q150 222 182 198%22/> <rect x=%22128%22 y=%22268%22 width=%2244%22 height=%2226%22/> <rect x=%2245%22 y=%22290%22 width=%22210%22 height=%22158%22 rx=%2238%22/> <rect x=%225%22 y=%22312%22 width=%2232%22 height=%2288%22 rx=%2216%22/><rect x=%22263%22 y=%22312%22 width=%2232%22 height=%2288%22 rx=%2216%22/></g> <path class=%22eye bi-bolt%22 d=%22M165 313L125 373H148L137 425L180 358H157Z%22/></svg>">
<style>
  html, body { margin: 0; height: 100%; background: #0b1120; color: #e2e8f0; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #0f172a; }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; overflow: hidden; z-index: 2; transition: opacity .6s, transform .6s;
    background: radial-gradient(ellipse 80% 55% at 50% 42%, #16243a 0%, #0b1120 70%); }
  #wait.gone { opacity: 0; transform: scale(1.05); pointer-events: none; }
  #wait > .stage { position: relative; z-index: 2; }
  /* ⚡ a glowing grid floor rolling toward you, a horizon glow, and sparks drifting up */
  .floor { position: absolute; left: -60%; right: -60%; bottom: -8%; height: 52%; z-index: 0;
    background-image: linear-gradient(rgba(148, 186, 101, .38) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(148, 186, 101, .38) 1.5px, transparent 1.5px); background-size: 64px 64px;
    transform: perspective(300px) rotateX(64deg); transform-origin: 50% 100%; animation: floor 1.8s linear infinite;
    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 88%); mask-image: linear-gradient(to top, #000 10%, transparent 88%); }
  @keyframes floor { to { background-position: 0 64px; } }
  .horizon { position: absolute; left: 0; right: 0; top: 52%; height: 2px; z-index: 0; background: linear-gradient(90deg, transparent, #94ba65 30%, #e5ffb8 50%, #94ba65 70%, transparent); box-shadow: 0 0 30px 8px rgba(148, 186, 101, .35); opacity: .55; }
  .spark { position: absolute; bottom: -12px; width: 3px; height: 3px; border-radius: 50%; background: #d9f99d; box-shadow: 0 0 8px 2px rgba(148, 186, 101, .8); z-index: 1; animation: rise linear infinite; }
  @keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(var(--dx, 20px), -105vh); opacity: 0; } }
  /* 🔌 the O charging up, plugged into Supplybot */
  .duo { display: flex; align-items: center; justify-content: center; gap: 0; }
  .core { position: relative; width: 156px; height: 156px; display: grid; place-items: center; flex: none; }
  .shock { position: absolute; inset: 26px; border-radius: 50%; border: 2px solid #94ba65; opacity: 0; animation: shock 2.6s ease-out infinite; }
  .shock:nth-child(2) { animation-delay: .87s; } .shock:nth-child(3) { animation-delay: 1.73s; }
  @keyframes shock { 0% { transform: scale(.55); opacity: .85; } 100% { transform: scale(1.65); opacity: 0; } }
  .halo { position: absolute; inset: 4px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 62%, rgba(148, 186, 101, .15) 70%, #b9e27f 92%, transparent 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .eso { position: relative; width: 104px; height: 99px; fill: #94ba65; overflow: visible; filter: drop-shadow(0 0 20px rgba(148, 186, 101, .5)); }
  .eso .ring { transform-box: view-box; transform-origin: 346px 35px; animation: ring 2.6s cubic-bezier(.6, 0, .3, 1) infinite; }
  .eso .bolt { transform-box: view-box; transform-origin: 346px 35px; animation: zap 2.6s ease-in-out infinite; }
  @keyframes ring { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(180deg); } }
  @keyframes zap { 0%, 55%, 100% { opacity: 1; filter: none; transform: scale(1); } 60% { opacity: .2; } 64% { opacity: 1; filter: drop-shadow(0 0 10px #f0ffd6); transform: scale(1.16); } 70% { opacity: .5; } 75% { opacity: 1; } }
  .cable { width: 86px; height: 70px; flex: none; margin: 34px -6px 0; overflow: visible; }
  .cable .cb { fill: none; stroke: #334155; stroke-width: 6; stroke-linecap: round; }
  .cable .flow { fill: none; stroke: #c6f08a; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 4 14; animation: flow .7s linear infinite; filter: drop-shadow(0 0 4px #94ba65); }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  .sbot { width: 82px; height: 124px; flex: none; fill: #e2e8f0; transform-origin: 50% 100%; animation: hop 1.3s cubic-bezier(.3, 0, .4, 1) infinite; filter: drop-shadow(0 8px 16px rgba(0, 0, 0, .45)); }
  .sbot .screen { fill: #0f172a; } .sbot .eye { fill: #94ba65; transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
  .sbot .smile { fill: none; stroke: #94ba65; stroke-width: 11; stroke-linecap: round; }
  .sbot .bi-bolt { animation: chest 1.3s ease-in-out infinite; } @keyframes chest { 50% { fill: #e5ffb8; } }
  @keyframes hop { 0%, 100% { transform: translateY(0) rotate(-4deg) scale(1, .96); } 45% { transform: translateY(-12px) rotate(4deg) scale(.98, 1.03); } }
  @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
  .logo { font-size: 30px; font-weight: 900; letter-spacing: .01em; margin-top: 10px; text-shadow: 0 0 22px rgba(148, 186, 101, .35); }
  .logo b { color: #94ba65; animation: glow 2.6s ease-in-out infinite; } @keyframes glow { 50% { color: #c6f08a; text-shadow: 0 0 18px rgba(198, 240, 138, .7); } }
  /* 🔋 the battery charges while Supplybot opens */
  .battery { position: relative; width: 230px; height: 28px; margin: 18px auto 10px; border: 2.5px solid #94ba65; border-radius: 9px; padding: 3px; box-sizing: border-box; box-shadow: 0 0 18px rgba(148, 186, 101, .25); }
  .battery::after { content: ""; position: absolute; right: -9px; top: 7px; width: 6px; height: 10px; border-radius: 0 3px 3px 0; background: #94ba65; }
  .battery i { display: block; height: 100%; width: 3%; border-radius: 5px; transition: width .5s ease-out;
    background: repeating-linear-gradient(120deg, #94ba65 0 10px, #b5dc7f 10px 20px); background-size: 200% 100%; animation: stripes 1s linear infinite; box-shadow: 0 0 12px rgba(148, 186, 101, .7); }
  @keyframes stripes { to { background-position: -40px 0; } }
  .battery span { position: absolute; inset: 0; display: grid; place-items: center; font: 800 13px/1 -apple-system, "Segoe UI", Roboto, sans-serif; color: #f8fafc; text-shadow: 0 1px 3px rgba(0, 0, 0, .8); }
  #msg { color: #cbd5e1; min-height: 1.5em; transition: opacity .3s; } #msg.fade { opacity: 0; }
  #help { display: none; max-width: 360px; margin: 0 auto; }
  #help.on { display: block; }
  #help p { color: #cbd5e1; margin: 10px 0 18px; }
  #help a { display: inline-block; padding: 16px 34px; font-size: 18px; border-radius: 14px; background: #94ba65; color: #0f172a; font-weight: 800; text-decoration: none; box-shadow: 0 0 24px rgba(148, 186, 101, .45); }
  @media (max-width: 480px) { .duo { transform: scale(.82); } .logo { font-size: 26px; } }
  @media (prefers-reduced-motion: reduce) { #wait *, #wait *::after { animation: none !important; } }
  #msg.tapme { font-weight: 800; color: #fde68a; animation: tapme 1.4s ease-in-out infinite; } @keyframes tapme { 50% { transform: scale(1.06); } }
</style>

<body>
<div id="wait">

  <div class="stage">
    <div class="duo"><div class="core"><span class="shock"></span><span class="shock"></span><span class="shock"></span><span class="halo"></span><svg class="eso" viewBox="305 -4 82 78" role="img" aria-label="EnviroSpark"><g class="ring"><path d="M336.07 59.24C323.28 57.68 316.23 51.98 316.23 34.95C316.23 14.82 326.09 10.6 343.65 10.27L347.74 3.65999C347.19 3.65999 346.65 3.64999 346.09 3.64999C323.19 3.64999 310.21 9.98 310.21 34.95C310.21 55.56 319.06 63.47 335.03 65.6L335.37 63.57C335.61 62.12 335.85 60.68 336.08 59.23L336.07 59.24Z"/><path d="M356.86 4.25998L355.81 10.71C368.76 12.2 375.86 17.8 375.86 34.95C375.86 55.4 365.77 59.51 347.69 59.73L343.68 66.22C344.47 66.24 345.27 66.25 346.09 66.25C368.99 66.25 381.9 59.92 381.9 34.95C381.9 14.22 373 6.33998 356.87 4.25998H356.86Z"/></g><path class="bolt" d="M337.91 68.75C337.98 68.77 338.04 68.8 338.11 68.82C345.95 56.14 353.78 43.46 361.72 30.63H349.14C350.82 20.37 352.48 10.21 354.14 0.05C354.08 0.03 354.02 0.02 353.96 0C346.14 12.65 338.32 25.31 330.37 38.15H342.92C342.07 43.38 341.26 48.46 340.43 53.54C339.6 58.61 338.76 63.68 337.92 68.74L337.91 68.75Z"/></svg></div>

<!-- 🔒 Supplybot may only take over the whole tab when you click something in it (like its ⟳ Reload), never by itself: Google's page
     sometimes reloads itself in the whole tab, which would bring back its "created by a Google Apps Script user" bar -->
<iframe id="app" title="Supplybot"
  sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-storage-access-by-user-activation allow-top-navigation-by-user-activation allow-pointer-lock allow-presentation allow-orientation-lock"
  allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; display-capture; web-share; autoplay"
  allowfullscreen></iframe>
<script>
  /* ✏️ Paste your Supplybot web app address here: Apps Script → Deploy → Manage deployments → the Web app URL (it ends in /exec) */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyT16dSQC9gSsHfPon0lcniHOdX9NKFR-bHolk-AsNem2henJq6jJIrfNTzv7OXNFSo/exec';

  (function () { try { var l = document.getElementById('ico'), im = new Image(); im.onload = function () { var c = document.createElement('canvas'); c.width = c.height = 180;
    var g = c.getContext('2d'), k = Math.min(180 / im.naturalWidth || 1, 180 / im.naturalHeight || 1); g.drawImage(im, 0, 0, 180, 180); var u = c.toDataURL('image/png');
    var p = document.createElement('link'); p.rel = 'icon'; p.type = 'image/png'; p.href = u; document.head.appendChild(p); var t = document.createElement('link'); t.rel = 'apple-touch-icon'; t.href = u; document.head.appendChild(t); }; im.src = l.href; } catch (x) {} })();
  /* ✨ the scene: sparks drifting up, the battery charging (it fills up to 95% while waiting, 100% when Supplybot is ready) and a few status lines */
  (function () { var w = document.getElementById('wait'); for (var k = 0; k < 26; k++) { var sp = document.createElement('span'); sp.className = 'spark';
      sp.style.left = (Math.random() * 100) + '%'; sp.style.animationDuration = (4 + Math.random() * 5).toFixed(1) + 's'; sp.style.animationDelay = (-Math.random() * 8).toFixed(1) + 's';
      sp.style.setProperty('--dx', ((Math.random() - .5) * 120).toFixed(0) + 'px'); w.appendChild(sp); }
    var b = document.getElementById('batt'), pc = document.getElementById('pct'), t0 = Date.now();
    window.__batt = setInterval(function () { var v = Math.round(3 + 92 * (1 - Math.exp(-(Date.now() - t0) / 4500))); if (window.__full) v = 100; b.style.width = v + '%'; pc.textContent = v >= 100 ? 'Fully charged ⚡' : 'Charging · ' + v + '%'; }, 120);
    var M = ['Charging up…', 'Waking up Supplybot…', 'Counting the shelves…', 'Syncing your inventory…', 'Checking on your orders…', 'Almost charged…'], n = 0, el = document.getElementById('msg');
    window.__msgT = setInterval(function () { if (el.style.display === 'none' || /Opening Supplybot/.test(el.textContent)) return; el.classList.add('fade'); setTimeout(function () { n = (n + 1) % M.length; el.textContent = M[n]; el.classList.remove('fade'); }, 300); }, 2000); })();
  var app = document.getElementById('app'), wait = document.getElementById('wait'), ready = false, alive = false, go = String(APP_URL || '').trim() + (location.search || '');   /* links like ?setup=1 or ?order=… are passed through */
  /* 📱 iPhone, iPad (every browser there) and Safari on a Mac block your Google sign-in inside another website's frame, so Google
     answers "401". There, Supplybot opens directly instead (your sign-in works); everywhere else it opens inside this page. */
  var ua = navigator.userAgent, apple = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
    || (/Safari/.test(ua) && !/Chrome|Chromium|CriOS|FxiOS|Edg|OPR|Android/.test(ua));
  /* inside another site's frame (e.g. a domain forwarded "with masking"), a page may only switch the whole tab after a tap */
  var framed = true; try { framed = window.top !== window; } catch (x) { framed = true; }
  /* no buttons: it keeps waiting and keeps trying to open Supplybot by itself */
  /* inside another site's frame it only ever opens Supplybot in the whole tab (never inside the frame, where iPhones answer 401);
     iPhones allow that after any touch, so a touch anywhere on the screen also opens it, no button needed */
  function direct() { if (framed) { try { window.top.location.href = go; } catch (x) {} return; } location.replace(go); }
  /* 🩺 a wrong address never opens: say so on screen instead of waiting forever */
  var cleanUrl = String(APP_URL || '').trim(), bad = '';
  if (!/^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[A-Za-z0-9_-]{20,}\/(exec|dev)$/.test(cleanUrl.split('?')[0])) bad = cleanUrl.indexOf('PASTE_YOUR') >= 0 ? 'Almost there: paste your Supplybot web app address into this page (the line that says APP_URL).' : 'The APP_URL in this page isn’t a Supplybot web app address. It should look like https://script.google.com/macros/s/…/exec';
  if (bad) { clearInterval(window.__msgT); var mm = document.getElementById('msg'); mm.textContent = '⚠️ ' + bad; mm.style.maxWidth = '420px'; mm.style.margin = '0 auto'; mm.style.opacity = '1'; } else {
  /* 📱 an iPhone showing this page inside another site's frame (a domain forwarded "with masking") only lets it open Supplybot after a touch:
     say so, so it never looks stuck */
  if (apple && framed) setTimeout(function () { if (ready || alive) return; clearInterval(window.__msgT); var mm = document.getElementById('msg'); mm.textContent = '👆 Tap anywhere to open Supplybot'; mm.style.opacity = '1'; mm.classList.add('tapme'); }, 1500);
  if (framed) ['pointerup', 'touchend', 'keydown'].forEach(function (ev) { document.addEventListener(ev, function () { if (!ready && !alive) direct(); }, true); });
  if (apple && framed) { direct(); setInterval(function () { if (!ready && !alive) direct(); }, 8000); }
  else if (apple) location.replace(go);
  else app.src = go;
  /* Supplybot says "ready" once it has opened inside this page */
  window.addEventListener('message', function (e) {
    if (!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
    if (e.data && e.data.supplybot === 'alive') { alive = true; return; }
    if (e.data && e.data.supplybot === 'ready') { ready = true; window.__full = true; setTimeout(function () { wait.classList.add('gone'); }, 450);
      /* ✂️ Google's "created by a Google Apps Script user" bar: Supplybot says how tall its own area is; the difference is the bar, so the
         frame moves up by exactly that much (no bar, no move, so Supplybot's header is never cut) */
      var h = Number(e.data.h), gap = h > 0 ? Math.round(app.getBoundingClientRect().height - h) : 0;
      if (gap > 2 && gap < 160) { app.style.bottom = 'auto'; app.style.top = (-gap) + 'px'; app.style.height = 'calc(100% + ' + gap + 'px)'; } }
  });
  /* not open inside this page after 10 seconds (usually Google sign-in, which can't show inside another site): open it directly, by itself.
     The button stays as a backup in case the browser stops the switch. */
  if (!(apple && framed)) setTimeout(function () { if (ready || alive) return; document.getElementById('msg').textContent = 'Opening Supplybot…'; direct();
    setInterval(function () { if (!ready && !alive) direct(); }, 15000); }, 40000);   /* ✏️ how long to wait before opening it directly (ms) */
  }
</script>
