<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --header: #0f766e;   /* header + scan button: dark teal in both themes so white text stays readable */
    --brand: #0f766e; --brand-soft: #ccfbf1; --danger: #b91c1c; --danger-soft: #fee2e2;
    --warn: #b45309; --warn-soft: #fef3c7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f14; --card: #151b23; --text: #e5e7eb; --muted: #9ca3af; --line: #263040;
      --header: #115e59;
      --brand: #2dd4bf; --brand-soft: #134e4a; --danger: #f87171; --danger-soft: #3b1515;
      --warn: #fbbf24; --warn-soft: #3a2a0a;
    }
  }
  /* ---------- Classic theme (no data-skin): black & white ----------
     Black header and black accents on neutral greys in light mode; black and charcoal with white accents in dark mode.
     Only Classic gets these, so the other themes (which build on the defaults above) are untouched. */
  :root:not([data-skin]) {
    --bg: #f4f4f4; --card: #fff; --text: #111; --muted: #6b6b6b; --line: #e3e3e3;
    --header: #111; --brand: #111; --brand-soft: #e8e8e8; --on-brand: #fff;
    --tc0: #404040;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-skin]) {
      --bg: #0a0a0a; --card: #161616; --text: #f2f2f2; --muted: #a3a3a3; --line: #2b2b2b;
      --header: #000; --brand: #f2f2f2; --brand-soft: #2a2a2a; --on-brand: #111;
      --tc0: #d4d4d4;
    }
    :root:not([data-skin]) header { border-bottom: 1px solid #262626; }
  }
  /* ---------- EV theme (picked per phone on the Activity tab) ----------
     Night-navy "charging station" header with an electric-lime edge, EnviroSpark greens for accents. */
  :root[data-skin="ev"] {
    --bg: #eef2f7; --card: #fff; --text: #0f172a; --muted: #64748b; --line: #dbe3ee;
    --header: #0c1b2e; --brand: #3f7d1c; --brand-soft: #e3f2d3; --on-brand: #fff; --spark: #a3e635;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="ev"] {
      --bg: #060a10; --card: #0e1622; --text: #e6edf5; --muted: #8fa0b5; --line: #1c2a3c;
      --header: #08111d; --brand: #a3e635; --brand-soft: #1d2e10; --on-brand: #0b1404; --spark: #a3e635;
    }
  }
  :root[data-skin="ev"] header { background: linear-gradient(120deg, var(--header) 0%, #12345a 100%);
    border-bottom: 2px solid var(--spark); box-shadow: 0 2px 14px rgba(163, 230, 53, .35); }
  :root[data-skin="ev"] header .add-item { background: var(--spark); color: #0b1404; }
  :root[data-skin="ev"] header .search { border: 1px solid rgba(163, 230, 53, .45); }
  :root[data-skin="ev"] nav button.scan .ico { background: radial-gradient(circle at 50% 35%, #1b4b78, var(--header) 70%); color: var(--spark);
    box-shadow: 0 0 0 2px var(--spark), 0 0 18px rgba(163, 230, 53, .6); }
  :root[data-skin="ev"] nav button.active .ico { filter: drop-shadow(0 0 4px rgba(163, 230, 53, .7)); }
  :root[data-skin="ev"] .stat.active { box-shadow: 0 0 0 1px var(--spark), 0 0 12px rgba(163, 230, 53, .3); }
  :root[data-skin="ev"] .qtysum { border-left: 4px solid var(--spark); }

  /* ---------- EnviroSpark theme, from envirosparkenergy.com ----------
     Light: white header like the website, slate-navy (#2D3142) buttons, sky-blue background, green bolt accents, Onest font.
     Dark: the website's navy for the header, EnviroSpark green (#94BA65) for buttons. */
  :root[data-skin="site"] {
    --bg: #edf5fc; --card: #fff; --text: #01183e; --muted: #5b6475; --line: #dbe4ee;
    --header: #ffffff; --brand: #2d3142; --brand-soft: #e3e8f1; --on-brand: #fff; --spark: #94ba65;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="site"] {
      --bg: #1a1b1e; --card: #141518; --text: #f3f4f6; --muted: #b4b8bf; --line: #34373d;
      --header: #2d3142; --brand: #94ba65; --brand-soft: #24301a; --on-brand: #0f1a05; --spark: #94ba65;
    }
    /* Metallic black: near-black brushed metal with a polished graphite sheen and faint brushed lines. */
    :root[data-skin="site"] body { background: transparent; }   /* the gold is on the page itself, so it fills the whole screen */
    html[data-skin="site"] { background-color: #0d0e10; }
    /* A fixed layer behind the page instead of background-attachment: fixed, which repaints the whole screen on every scroll. */
    html[data-skin="site"]::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background-image:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 3px),
        linear-gradient(135deg, #000000 0%, #121316 24%, #2a2c31 44%, #3d4046 50%, #26282c 57%, #0e0f11 78%, #000000 100%);
    }
    :root[data-skin="site"] .card, :root[data-skin="site"] .item, :root[data-skin="site"] .ocard, :root[data-skin="site"] .stat,
    :root[data-skin="site"] .qtysum, :root[data-skin="site"] .log, :root[data-skin="site"] .users-btn, :root[data-skin="site"] .theme-pick {
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .10), 0 2px 10px rgba(0, 0, 0, .5);
    }
  }
  @media (prefers-color-scheme: dark) {   /* navy header: the New Item button switches to EnviroSpark green so it stands out */
    :root[data-skin="site"] header .hdr-actions .add-item { background: var(--spark); color: #0f1a05; }
  }
  :root[data-skin="site"] body, :root[data-skin="site"] button, :root[data-skin="site"] input,
  :root[data-skin="site"] select, :root[data-skin="site"] textarea { font-family: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  :root[data-skin="site"] h1, :root[data-skin="site"] h2, :root[data-skin="site"] .detail-name { font-weight: 800; letter-spacing: -.01em; }
  :root[data-skin="site"] header { border-bottom: 3px solid var(--spark); box-shadow: 0 2px 10px rgba(1, 24, 62, .08); }
  :root[data-skin="site"] header .add-item { background: #2d3142; color: #fff; box-shadow: none; }
  :root[data-skin="site"] nav button.scan .ico { background: #2d3142; color: #fff; box-shadow: 0 0 0 3px var(--spark), 0 4px 14px rgba(1, 24, 62, .3); }
  :root[data-skin="site"] .stat.active { border-color: var(--spark); }
  :root[data-skin="site"] .qtysum { border-left: 4px solid var(--spark); }
  :root[data-skin="site"] .chip.active { box-shadow: inset 0 -2px 0 var(--spark); }
  @media (prefers-color-scheme: light) {   /* the white header needs dark text and icons */
    :root[data-skin="site"] header { color: var(--text); }
    :root[data-skin="site"] header .bell, :root[data-skin="site"] header .refresh { color: #2d3142; }
    :root[data-skin="site"] header .search { background: var(--bg); color: var(--text); }
    :root[data-skin="site"] header .ro-pill { background: var(--brand-soft); color: #2d3142; }
  }

  /* Metallic header (light and dark): white on the left, through EnviroSpark lime green, to black on the right, with a
     polished sheen on top and faint brushed lines. The title sits on the light end (dark text); the icons on the dark end (white). */
  :root[data-skin="site"] header {
    /* Glass: the tint is see-through and the list scrolling underneath shows through a light frost (15% of the
       original 18px blur, kept small because a heavier live blur flickered on phones), with a bright top edge,
       a glossy sheen on the upper half and a thin light rim along the bottom. */
    background-color: transparent;
    -webkit-backdrop-filter: blur(2.7px) saturate(1.7); backdrop-filter: blur(2.7px) saturate(1.7);
    background-image:
      linear-gradient(180deg, rgba(255, 255, 255, .38) 0%, rgba(255, 255, 255, .12) 44%, rgba(255, 255, 255, 0) 52%, rgba(0, 0, 0, .06) 100%),
      linear-gradient(100deg, rgba(255, 255, 255, .42) 0%, rgba(238, 246, 226, .38) 12%, rgba(200, 229, 143, .36) 28%, rgba(148, 186, 101, .36) 44%,
        rgba(95, 138, 46, .38) 60%, rgba(36, 51, 26, .42) 78%, rgba(5, 7, 5, .46) 92%, rgba(0, 0, 0, .48) 100%);
    color: #0b1a05; border-bottom: 1px solid rgba(255, 255, 255, .45);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), inset 0 -1px 0 rgba(0, 0, 0, .12), 0 2px 0 var(--spark), 0 6px 18px rgba(0, 0, 0, .18);
  }
  /* The bottom bar is glass too, with the same 15% frost. */
  :root[data-skin="site"] nav {
    background: rgba(255, 255, 255, .6); -webkit-backdrop-filter: blur(2.7px) saturate(1.6); backdrop-filter: blur(2.7px) saturate(1.6);
    border-top: 1px solid rgba(255, 255, 255, .7); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 -4px 14px rgba(0, 0, 0, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="site"] nav { background: rgba(14, 15, 17, .62); border-top-color: rgba(255, 255, 255, .14); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); }
  }
  /* Easy to read on the glass: labels get a soft halo in the opposite color of their text, and emojis a thin outline
     shadow, so both stand out from whatever scrolls behind (the glass itself is unchanged). */
  :root[data-skin="site"] nav button { color: #1f2937; font-weight: 600;
    text-shadow: 0 0 2px rgba(255, 255, 255, .95), 0 0 6px rgba(255, 255, 255, .9), 0 1px 0 rgba(255, 255, 255, .8); }
  :root[data-skin="site"] nav button.active { color: #2d3142; font-weight: 800; }
  :root[data-skin="site"] nav button:not(.scan) .ico { filter: drop-shadow(0 0 1px rgba(0, 0, 0, .55)) drop-shadow(0 1px 2px rgba(0, 0, 0, .35)) drop-shadow(0 0 5px rgba(255, 255, 255, .85)); }
  :root[data-skin="site"] header .bot-text small { opacity: 1; text-shadow: 0 0 2px rgba(255, 255, 255, .95), 0 0 5px rgba(255, 255, 255, .8); }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="site"] nav button { color: #f3f4f6; text-shadow: 0 0 2px rgba(0, 0, 0, .95), 0 0 6px rgba(0, 0, 0, .85), 0 1px 1px rgba(0, 0, 0, .9); }
    :root[data-skin="site"] nav button.active { color: #c6f06b; }
    :root[data-skin="site"] nav button:not(.scan) .ico { filter: drop-shadow(0 0 1px rgba(0, 0, 0, .8)) drop-shadow(0 1px 3px rgba(0, 0, 0, .7)); }
    :root[data-skin="site"] header .bot-text small { text-shadow: 0 0 2px rgba(0, 0, 0, .95), 0 0 5px rgba(0, 0, 0, .8); }
  }
  /* Item and order cards: in dark mode every label and emoji gets a soft dark shadow so its edges stand out, and the grey
     and green secondary text is a step brighter; the 📦 placeholder gets a small shadow in both modes. */
  :root[data-skin="site"] .lthumb { text-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="site"] :is(.item, .ocard) { text-shadow: 0 1px 2px rgba(0, 0, 0, .9), 0 0 1px rgba(0, 0, 0, .7); }
    :root[data-skin="site"] :is(.item .meta, .item .qty small, .ocard .sub, .ocard .where, .ocard .nums, .ocard .nums .ship, .ocard .otot small) { color: #d7dbe1; }
    :root[data-skin="site"] .item .specs { color: #b9e07f; }
    :root[data-skin="site"] :is(.item, .ocard) .badge, :root[data-skin="site"] .ocard .ostatus { text-shadow: none; font-weight: 700; }
    :root[data-skin="site"] .lthumb { text-shadow: 0 1px 3px rgba(0, 0, 0, .9); }
  }
  :root[data-skin="site"] header h1 .brand { text-shadow: 0 1px 0 rgba(255, 255, 255, .7); }
  @media (prefers-color-scheme: dark) {   /* the glass header shows the black page through it, so the title turns white there */
    :root[data-skin="site"] header h1 .brand { color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
  }
  :root[data-skin="site"] header .bell, :root[data-skin="site"] header .refresh { color: #fff; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .5)); }
  :root[data-skin="site"] header .hdr-actions .add-item { background: #c6f06b; color: #0b1a05; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
  :root[data-skin="site"] header .search { background: rgba(255, 255, 255, .94); color: #01183e; border: 1px solid rgba(0, 0, 0, .18); }
  :root[data-skin="site"] header .ro-pill { background: rgba(11, 26, 5, .12); color: #0b1a05; }
  /* Slide-up panels (item, order, forms): plain white glass in light mode and black glass in dark mode, with the
     header's see-through amount and light frost, and the spark-green rim along the top. */
  :root[data-skin="site"] .sheet, :root[data-skin="site"] .sheet .sticky-foot, :root[data-skin="site"] .sheet .cat-foot, :root[data-skin="site"] .sheet .pick-head {
    background: rgba(255, 255, 255, .45);
    -webkit-backdrop-filter: blur(2.7px) saturate(1.7); backdrop-filter: blur(2.7px) saturate(1.7);
  }
  :root[data-skin="site"] .sheet { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 -2px 0 var(--spark), 0 -6px 18px rgba(0, 0, 0, .18); }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="site"] .sheet, :root[data-skin="site"] .sheet .sticky-foot, :root[data-skin="site"] .sheet .cat-foot, :root[data-skin="site"] .sheet .pick-head { background: rgba(0, 0, 0, .45); }
    :root[data-skin="site"] .sheet { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 -2px 0 var(--spark), 0 -6px 18px rgba(0, 0, 0, .4); }
  }

  /* ---------- Girl Power theme: hot pink → purple header, fuchsia buttons, lime-green sparks ---------- */
  :root[data-skin="girl"] {
    --bg: #fdf2fb; --card: #fff; --text: #2a0f2e; --muted: #7a5a80; --line: #f1d6ec;
    --header: #c026d3; --brand: #a21caf; --brand-soft: #fae8ff; --on-brand: #fff; --spark: #a3e635;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="girl"] {
      --bg: #170a1c; --card: #24112b; --text: #fbeffd; --muted: #c4a6cc; --line: #3d1f47;
      --header: #7e22ce; --brand: #f472b6; --brand-soft: #4a1238; --on-brand: #2a0418; --spark: #a3e635;
    }
  }
  :root[data-skin="girl"] header { background: linear-gradient(120deg, #ec4899 0%, #c026d3 50%, #7e22ce 100%);
    border-bottom: 3px solid var(--spark); box-shadow: 0 2px 14px rgba(163, 230, 53, .4); }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="girl"] header { background: linear-gradient(120deg, #be185d 0%, #86198f 50%, #581c87 100%); }
  }
  :root[data-skin="girl"] header .hdr-actions .add-item { background: var(--spark); color: #3b0764; }
  :root[data-skin="girl"] header .search { border: 1px solid rgba(163, 230, 53, .6); }
  :root[data-skin="girl"] nav button.scan .ico { background: linear-gradient(135deg, #ec4899, #7e22ce); color: #fff;
    box-shadow: 0 0 0 3px var(--spark), 0 0 16px rgba(236, 72, 153, .55); }
  :root[data-skin="girl"] nav button.active .ico { filter: drop-shadow(0 0 4px rgba(236, 72, 153, .7)); }
  :root[data-skin="girl"] .stat.active { border-color: #ec4899; box-shadow: 0 0 0 1px var(--spark); }
  :root[data-skin="girl"] .qtysum { border-left: 4px solid var(--spark); }
  :root[data-skin="girl"] .chip.active { box-shadow: inset 0 -2px 0 var(--spark); }

  /* ---------- White Glass theme: brushed-silver page, frosted-glass header, cards and tab bar, chrome Scan button ----------
     Light: white/silver metal with clear glass panels and graphite text and buttons.
     Dark: gunmetal with smoky glass panels and silver buttons. */
  :root[data-skin="glass"] {
    --bg: #eef1f5; --card: #fbfcfd; --text: #1f2933; --muted: #5f6b7a; --line: #dde2e8;
    --header: #e9edf2; --brand: #374151; --brand-soft: #e6eaef; --on-brand: #fff; --spark: #b8c4d2;
    --glass: rgba(255, 255, 255, .58); --glass-edge: rgba(255, 255, 255, .9); --glass-shadow: 0 6px 22px rgba(30, 41, 59, .10);
  }
  html[data-skin="glass"] { background-color: #e9edf1; }
  /* A fixed layer behind the page instead of background-attachment: fixed, which repaints the whole screen on every scroll. */
  html[data-skin="glass"]::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      repeating-linear-gradient(90deg, rgba(255, 255, 255, .35) 0 1px, rgba(0, 0, 0, .012) 1px 2px, transparent 2px 4px),
      linear-gradient(135deg, #f8f9fb 0%, #dfe4ea 24%, #ffffff 46%, #d5dbe2 58%, #eef1f5 78%, #cfd6de 100%);
  }
  :root[data-skin="glass"] body { background: transparent; }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="glass"] {
      --bg: #262a31; --card: #23272e; --text: #f1f3f6; --muted: #aab2bd; --line: #3a414b;
      --header: #2b3038; --brand: #e3e8ee; --brand-soft: #383e48; --on-brand: #14171b; --spark: #8b97a6;
      --glass: rgba(255, 255, 255, .07); --glass-edge: rgba(255, 255, 255, .16); --glass-shadow: 0 6px 22px rgba(0, 0, 0, .35);
    }
    html[data-skin="glass"] { background-color: #1d2025; }
    html[data-skin="glass"]::before {
      background-image:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px),
        linear-gradient(135deg, #15171b 0%, #2a2f37 26%, #4a515c 47%, #2c3139 60%, #1b1e23 100%);
    }
  }
  /* frosted glass panels */
  :root[data-skin="glass"] header, :root[data-skin="glass"] nav, :root[data-skin="glass"] .item, :root[data-skin="glass"] .ocard,
  :root[data-skin="glass"] .stat, :root[data-skin="glass"] .qtysum, :root[data-skin="glass"] .log, :root[data-skin="glass"] .users-btn,
  :root[data-skin="glass"] .theme-pick, :root[data-skin="glass"] .chip, :root[data-skin="glass"] .catbtn {
    background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5);
    border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-edge);
  }
  :root[data-skin="glass"] .chip.active { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  :root[data-skin="glass"] .catbtn.active { background: var(--brand-soft); border-color: var(--brand); }
  :root[data-skin="glass"] header { border-width: 0 0 1px; background-image: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, .15));
    color: var(--text); }
  :root[data-skin="glass"] header .bell, :root[data-skin="glass"] header .refresh { color: var(--text); }
  :root[data-skin="glass"] header .hdr-actions .add-item { color: #1f2933; border: 1px solid rgba(255, 255, 255, .9);
    background: linear-gradient(180deg, #ffffff 0%, #e4e8ed 48%, #cfd5dc 52%, #f3f5f7 100%); box-shadow: 0 1px 3px rgba(0, 0, 0, .18); }
  :root[data-skin="glass"] header .search { background: rgba(255, 255, 255, .75); color: #1f2933; border: 1px solid rgba(255, 255, 255, .9); }
  :root[data-skin="glass"] header .ro-pill { background: var(--brand-soft); color: var(--text); }
  :root[data-skin="glass"] nav { border-width: 1px 0 0; }
  :root[data-skin="glass"] nav button.scan .ico { color: #1f2933; border-color: rgba(255, 255, 255, .9);
    background: linear-gradient(160deg, #ffffff 0%, #dde2e8 45%, #b9c1cb 55%, #f4f6f8 100%);
    box-shadow: 0 0 0 1px rgba(148, 163, 184, .6), 0 6px 16px rgba(30, 41, 59, .25); }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="glass"] header { background-image: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .03)); }
    :root[data-skin="glass"] header .search { background: rgba(255, 255, 255, .12); color: var(--text); border-color: rgba(255, 255, 255, .18); }
    :root[data-skin="glass"] header .search::placeholder { color: var(--muted); }
  }

  /* ---------- Black Glass theme: the White Glass idea in black ----------
     Black brushed-metal page, smoky see-through glass header, cards and tab bar, glossy black buttons with silver
     accents. It stays black whether the phone is in light or dark mode. */
  :root[data-skin="black"] {
    color-scheme: dark;
    --bg: #141518; --card: #17181b; --text: #f2f3f5; --muted: #a1a6ae; --line: #2c2f35;
    --header: #0b0c0e; --brand: #e6e8eb; --brand-soft: #2a2d33; --on-brand: #0b0c0e; --spark: #6b7280;
    --danger: #f87171; --danger-soft: #3b1515; --warn: #fbbf24; --warn-soft: #3a2a0a;
    --glass: rgba(255, 255, 255, .06); --glass-edge: rgba(255, 255, 255, .14); --glass-shadow: 0 6px 22px rgba(0, 0, 0, .55);
  }
  html[data-skin="black"] { background-color: #050506; }
  /* A fixed layer behind the page instead of background-attachment: fixed, which repaints the whole screen on every scroll. */
  html[data-skin="black"]::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      repeating-linear-gradient(90deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px),
      linear-gradient(135deg, #000000 0%, #16171a 26%, #2b2e33 47%, #141518 60%, #000000 100%);
  }
  :root[data-skin="black"] body { background: transparent; }
  /* smoky glass panels */
  :root[data-skin="black"] header, :root[data-skin="black"] nav, :root[data-skin="black"] .item, :root[data-skin="black"] .ocard,
  :root[data-skin="black"] .stat, :root[data-skin="black"] .qtysum, :root[data-skin="black"] .log, :root[data-skin="black"] .users-btn,
  :root[data-skin="black"] .theme-pick, :root[data-skin="black"] .chip, :root[data-skin="black"] .catbtn {

  }
  :root[data-skin="black"] .chip.active { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  :root[data-skin="black"] .catbtn.active { background: var(--brand-soft); border-color: var(--brand); }
  :root[data-skin="black"] header { border-width: 0 0 1px; background-image: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .02));
    color: var(--text); }
  :root[data-skin="black"] header .bell, :root[data-skin="black"] header .refresh { color: var(--text); }
  :root[data-skin="black"] header .hdr-actions .add-item { color: #fff; border: 1px solid rgba(255, 255, 255, .2);
    background: linear-gradient(180deg, #3a3d43 0%, #1c1e22 48%, #0b0c0e 52%, #24262b 100%); box-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
  :root[data-skin="black"] header .search { background: rgba(255, 255, 255, .08); color: var(--text); border: 1px solid rgba(255, 255, 255, .16); }
  :root[data-skin="black"] header .search::placeholder { color: var(--muted); }
  :root[data-skin="black"] header .ro-pill { background: var(--brand-soft); color: var(--text); }
  :root[data-skin="black"] nav { border-width: 1px 0 0; }
  :root[data-skin="black"] nav button.scan .ico { color: #fff; border-color: #000;
    background: linear-gradient(160deg, #4a4e55 0%, #1c1e22 45%, #000000 55%, #2c2f35 100%);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .25), 0 6px 16px rgba(0, 0, 0, .6); }

  /* ---------- Simple theme: built for speed on any computer, Mac or phone ----------
     Flat colours only: no glass blur, gradients, shadows or animations (the effects that make older or busy devices
     slow), and panels open instantly. Charcoal header with the logo's green (#94BA65) for accents: a deeper shade of it in
     light mode so text and buttons stay readable on white, the logo green itself in dark mode. Follows the device's light / dark setting. */
  :root[data-skin="simple"] {
    --bg: #f3f4f6; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --header: #1f2937; --brand: #4f7a28; --brand-soft: #e7f1da; --on-brand: #fff; --spark: #94ba65;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="simple"] {
      --bg: #111315; --card: #1b1e22; --text: #e5e7eb; --muted: #9ca3af; --line: #2d3238;
      --header: #1b1e22; --brand: #94ba65; --brand-soft: #24301a; --on-brand: #0f1a05; --spark: #94ba65;
    }
  }
  :root[data-skin="simple"] *, :root[data-skin="simple"] *::before, :root[data-skin="simple"] *::after {
    box-shadow: none !important; text-shadow: none !important; filter: none !important;
    -webkit-backdrop-filter: none !important; backdrop-filter: none !important; animation: none !important; transition: none !important;
  }
  :root[data-skin="simple"] header { border-bottom: 1px solid var(--line); }
  :root[data-skin="simple"] nav button.scan .ico { background: var(--spark); color: #0f1a05; }
  :root[data-skin="simple"] .facts.tiles .fact.hero { background: var(--brand-soft); }
  :root[data-skin="simple"] .item, :root[data-skin="simple"] .ocard, :root[data-skin="simple"] .stat { border: 1px solid var(--line); }

  /* ---------- Modern theme: clean lines, soft depth and the Plus Jakarta Sans font ----------
     Light header, rounder cards with soft shadows, pill buttons and tighter headings, in greens that run from yellow
     lime to deep forest: forest green for buttons and links (easy to read), lime tints for highlights, and a
     lime → leaf → forest gradient on the main buttons, the Scan button and the stripe under the header.
     Follows the device's light / dark setting. */
  :root[data-skin="modern"] {
    --bg: #f3f8ec; --card: #ffffff; --text: #10251a; --muted: #5d725f; --line: #dbe8d1;
    --header: #fbfdf6; --brand: #1f6b36; --brand-soft: #e5f3d3; --on-brand: #fff; --spark: #a3d14a;
    --m-grad: linear-gradient(135deg, #b5dc4f 0%, #6fb43f 38%, #2e7d32 72%, #1a4d2a 100%);
    --m-stripe: linear-gradient(90deg, #d9f070, #9ccc4b 30%, #4f9a3a 62%, #1d5530);
    --m-shadow: 0 1px 2px rgba(16, 37, 26, .05), 0 8px 24px -12px rgba(27, 77, 42, .22);
  }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="modern"] {
      --bg: #0a130c; --card: #112016; --text: #e5f2df; --muted: #9bb69a; --line: #1e3424;
      --header: #0d1a10; --brand: #a6d95f; --brand-soft: #1b3420; --on-brand: #0a130c; --spark: #c8e86a;
      --m-grad: linear-gradient(135deg, #dcf37a 0%, #9fd257 35%, #5ea845 70%, #2f7a36 100%);
      --m-stripe: linear-gradient(90deg, #e3f78a, #a6d95f 30%, #5ea845 62%, #2a6b32);
      --m-shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 10px 28px -14px rgba(0, 0, 0, .75);
    }
  }
  :root[data-skin="modern"] header { border-bottom: 3px solid transparent !important; border-image: var(--m-stripe) 1; }
  :root[data-skin="modern"] .btn.primary, :root[data-skin="modern"] header .hdr-actions .add-item { background: var(--m-grad); border-color: transparent; }
  :root[data-skin="modern"] .chip.active { background: var(--m-grad); border-color: transparent; color: var(--on-brand); }
  :root[data-skin="modern"] .qtysum { border-left: 4px solid transparent !important; border-image: linear-gradient(180deg, #c5e35a, #2e7d32) 1; }
  :root[data-skin="modern"] body, :root[data-skin="modern"] button, :root[data-skin="modern"] input,
  :root[data-skin="modern"] select, :root[data-skin="modern"] textarea { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  :root[data-skin="modern"] h1, :root[data-skin="modern"] h2, :root[data-skin="modern"] .detail-name { font-weight: 800; letter-spacing: -.02em; }
  :root[data-skin="modern"] header { color: var(--text); border-bottom: 1px solid var(--line); box-shadow: var(--m-shadow); }
  :root[data-skin="modern"] header .bell, :root[data-skin="modern"] header .refresh { color: var(--text); }
  :root[data-skin="modern"] header .search { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 14px; }
  :root[data-skin="modern"] header .search::placeholder { color: var(--muted); }
  :root[data-skin="modern"] header .hdr-actions .add-item { background: var(--brand); color: var(--on-brand); box-shadow: 0 6px 16px -6px var(--brand); }
  :root[data-skin="modern"] header .ro-pill { background: var(--brand-soft); color: var(--brand); }
  :root[data-skin="modern"] header .me-btn { border-color: var(--line); }
  :root[data-skin="modern"] .item, :root[data-skin="modern"] .ocard, :root[data-skin="modern"] .stat, :root[data-skin="modern"] .qtysum,
  :root[data-skin="modern"] .log, :root[data-skin="modern"] .users-btn, :root[data-skin="modern"] .theme-pick {
    border-radius: 18px; border: 1px solid var(--line); box-shadow: var(--m-shadow); }
  :root[data-skin="modern"] .stat.active { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft), var(--m-shadow); }
  :root[data-skin="modern"] .btn { border-radius: 14px; }
  :root[data-skin="modern"] .btn.primary { box-shadow: 0 6px 16px -8px var(--brand); }
  :root[data-skin="modern"] .catbtn, :root[data-skin="modern"] .field { border-radius: 14px; }
  :root[data-skin="modern"] .sheet { border-radius: 26px 26px 0 0; }
  :root[data-skin="modern"] nav { background: color-mix(in srgb, var(--card) 92%, transparent); border-top: 1px solid var(--line); }
  :root[data-skin="modern"] nav button.scan .ico { background: var(--m-grad); color: var(--on-brand); border-color: var(--bg);
    box-shadow: 0 10px 22px -8px var(--brand); }
  :root[data-skin="modern"] .facts.tiles .fact { border-radius: 16px; }

  /* ---------- Georgia Bulldogs theme: black header, Bulldog red, white ---------- */
  :root[data-skin="uga"] {
    --bg: #f5f3f3; --card: #fff; --text: #111111; --muted: #5f5f63; --line: #e4dfdf;
    --header: #000000; --brand: #ba0c2f; --brand-soft: #fbe3e8; --on-brand: #fff; --spark: #ba0c2f;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="uga"] {
      --bg: #0a0a0a; --card: #171717; --text: #f3f3f3; --muted: #a3a3a3; --line: #2b2b2b;
      --header: #000000; --brand: #e4002b; --brand-soft: #3a0a14; --on-brand: #fff; --spark: #e4002b;
    }
  }
  :root[data-skin="uga"] header { background: #000; border-bottom: 4px solid var(--spark); box-shadow: inset 0 -6px 0 -4px #fff; }
  :root[data-skin="uga"] header .add-item { background: var(--spark); color: #fff; }
  :root[data-skin="uga"] nav button.scan .ico { background: #000; color: #fff; box-shadow: 0 0 0 3px var(--spark), 0 4px 14px rgba(0,0,0,.35); }
  :root[data-skin="uga"] .stat.active { box-shadow: 0 0 0 1px var(--spark); }
  :root[data-skin="uga"] .qtysum { border-left: 4px solid var(--spark); }
  /* red means "Out" elsewhere in the app, so the In stock count stays neutral in this theme */
  :root[data-skin="uga"] .summary .stat:nth-child(2) b { color: var(--text) !important; }

  /* ---------- Gold theme: near-black header with a metallic gold stripe, warm ivory (or espresso in dark mode),
     and polished gold buttons with dark lettering so they stay easy to read ---------- */
  :root[data-skin="gold"] {
    --bg: #f8f3e6; --card: #fffdf6; --text: #261d0c; --muted: #7a6a4b; --line: #eadfc2;
    --header: #17130c; --brand: #8f6a0e; --brand-soft: #f6eccd; --on-brand: #241a03; --spark: #d4af37;
    --g-metal: linear-gradient(135deg, #fbefa6 0%, #e7c55a 28%, #c99a2e 55%, #f2d77c 72%, #a87a18 100%);
    --g-stripe: linear-gradient(90deg, #8a6514, #d4af37 25%, #fbefa6 50%, #d4af37 75%, #8a6514);
  }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="gold"] {
      --bg: #0e0b06; --card: #19140c; --text: #f4ead2; --muted: #b5a27a; --line: #30281a;
      --header: #0b0905; --brand: #e6c35c; --brand-soft: #2e2510; --on-brand: #1b1404; --spark: #f0cf6b;
    }
  }
  :root[data-skin="gold"] header { background: linear-gradient(180deg, #221b10, var(--header)); border-bottom: 3px solid transparent; border-image: var(--g-stripe) 1; }
  :root[data-skin="gold"] header .search { background: rgba(255, 255, 255, .08); color: #fbf3dc; border: 1px solid rgba(212, 175, 55, .45); }
  :root[data-skin="gold"] header .search::placeholder { color: rgba(251, 243, 220, .6); }
  :root[data-skin="gold"] header .me-btn { border-color: #d4af37; }
  :root[data-skin="gold"] .btn.primary, :root[data-skin="gold"] header .add-item, :root[data-skin="gold"] .chip.active {
    background: var(--g-metal); color: #241a03; border-color: transparent; text-shadow: 0 1px 0 rgba(255, 255, 255, .35); }
  :root[data-skin="gold"] .btn.primary { box-shadow: 0 6px 16px -8px rgba(150, 110, 20, .8), inset 0 1px 0 rgba(255, 255, 255, .5); }
  :root[data-skin="gold"] nav button.scan .ico { background: var(--g-metal); color: #241a03; box-shadow: 0 0 0 3px #17130c, 0 6px 16px -4px rgba(150, 110, 20, .7); }
  :root[data-skin="gold"] nav button.active, :root[data-skin="gold"] nav button.scan { color: var(--brand); }
  :root[data-skin="gold"] .stat.active { border-color: var(--spark); box-shadow: 0 0 0 1px var(--spark); }
  :root[data-skin="gold"] .qtysum { border-left: 4px solid transparent; border-image: linear-gradient(180deg, #fbefa6, #c99a2e, #8a6514) 1; }
  :root[data-skin="gold"] .item, :root[data-skin="gold"] .ocard { border-color: var(--line); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  /* 🔤 Font (My profile): replaces the theme's lettering everywhere it isn't deliberately different (monospace looks keep theirs) */
  :root[data-font] :is(body, button:not(.fontchoice), input, select, textarea) { font-family: var(--app-font) !important; }   /* each choice shows its own font */
  .fontchoices { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin: 6px 0 4px; }
  .fontchoice { display: grid; justify-items: center; gap: 2px; padding: 10px 6px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: var(--text); }
  .fontchoice b { font-size: 24px; font-weight: 700; line-height: 1.1; }
  .fontchoice small { font-size: 10.5px; color: var(--muted); line-height: 1.2; text-align: center; }
  .fontchoice span { font-size: 12px; font-weight: 600; }
  .fontchoice.on { border-color: var(--brand); background: var(--brand-soft); }

  header { position: sticky; top: 0; z-index: 5; background: var(--header); color: #fff;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; }
  header h1 { margin: 0 0 10px; font-size: 20px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  /* EnviroSpark logo: the green mark straight on the header (no tile) */
  header .brand { display: flex; align-items: center; gap: 9px; min-width: 0; white-space: nowrap; }
  /* The EnviroSpark wordmark: "SPARK" stays green; "ENVIRO" (and the bolt) is drawn in --logo-ink, white on the dark
     headers and the logo's own grey on the light ones, so it shows on every theme. */
  header .logo { flex: none; display: grid; place-items: center; background: none; }
  header .logo .wordmark { display: block; height: 30px; width: auto; }
  :root { --logo-ink: #fff; }
  :root[data-skin="glass"], :root[data-skin="modern"] { --logo-ink: #444; }
  @media (prefers-color-scheme: light) { :root[data-skin="site"] { --logo-ink: #444; } }
  @media (prefers-color-scheme: dark) { :root[data-skin="glass"], :root[data-skin="modern"] { --logo-ink: #fff; } }
  /* Supplybot: the robot is drawn in the same ink as "ENVIRO" (white on dark headers, grey on light ones); its face
     screen is dark on dark headers and pale on light ones, so the green eyes and smile always stand out. */
  :root { --bot-screen: rgba(0, 0, 0, .55); --bot-smile: #fff; }
  :root[data-skin="glass"], :root[data-skin="modern"] { --bot-screen: #eef4e6; --bot-smile: #444; }
  @media (prefers-color-scheme: light) { :root[data-skin="site"] { --bot-screen: #eef4e6; --bot-smile: #444; } }
  @media (prefers-color-scheme: dark) { :root[data-skin="glass"], :root[data-skin="modern"] { --bot-screen: rgba(0, 0, 0, .55); --bot-smile: #fff; } }
  header .bot-name { display: flex; align-items: center; gap: 7px; min-width: 0; padding-left: 9px; border-left: 1px solid currentColor;
    border-left-color: color-mix(in srgb, currentColor 30%, transparent); }
  header .bot { flex: none; height: 30px; width: auto; fill: var(--logo-ink); }
  header .bot .screen { fill: var(--bot-screen); }
  header .bot .eye { fill: #94ba65; }
  header .bot .smile { fill: none; stroke: var(--bot-smile); stroke-width: 11; stroke-linecap: round; }
  header .bot-text { display: flex; flex-direction: column; min-width: 0; line-height: 1; }
  header .bot-text b { font-size: 20px; font-weight: 800; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; }
  header .bot-text small { display: none; margin-top: 3px; font-size: 8px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
  /* Macs and PCs (a mouse or trackpad and a wide window): the full Supplybot logo, with a bigger robot and both
     tagline lines. Phones and tablets show just the robot and the name. */
  @media (min-width: 640px) and (hover: hover) and (pointer: fine) {
    header .bot-name { gap: 10px; padding-left: 12px; }
    header .bot { height: 46px; }
    header .bot-text b { font-size: 23px; }
    header .bot-text small { display: block; }
    header .bot-text small + small { margin-top: 4px; }
  }
  header .hdr-actions { display: flex; align-items: center; gap: 6px; flex: none; }   /* the buttons keep their room; the name shrinks (fitBotName) */
  header .add-item { white-space: nowrap; flex: none; padding: 8px 14px; border: 0; border-radius: 999px; background: #fff; color: var(--header);
    font-size: 15px; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  header .refresh { background: none; border: 0; color: #fff; font-size: 22px; padding: 4px 8px; }
  header .refresh.spin { animation: refreshSpin .8s ease-in-out; }   /* the data just updated by itself */
  @keyframes refreshSpin { to { transform: rotate(360deg); } }
  /* My profile: your portrait (or initials) at the end of the header */
  header .me-btn { flex: none; width: 32px; height: 32px; margin-left: 2px; padding: 0; border-radius: 50%; overflow: hidden;
    border: 2px solid rgba(255, 255, 255, .9); background: var(--brand-soft); color: var(--brand); display: grid; place-items: center;
    font-size: 12px; font-weight: 800; }
  header .me-btn img, .profile .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .profile { text-align: center; }
  /* Commenter's portrait (or initials) before their name */
  .cav { display: inline-grid; place-items: center; width: 24px; height: 24px; margin-right: 7px; vertical-align: middle; border-radius: 50%;
    overflow: hidden; background: var(--brand-soft); color: var(--brand); font-size: 10px; font-weight: 800; flex: none; }
  .cav img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .note .s .cav { width: 20px; height: 20px; margin-right: 6px; font-size: 9px; }
  .profile .pic { width: 128px; height: 128px; margin: 6px auto 12px; border-radius: 50%; overflow: hidden; border: 3px solid var(--brand);
    background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 46px; font-weight: 800; }
  .profile .nm { font-size: 21px; font-weight: 800; }
  .profile .em { margin-top: 2px; color: var(--muted); word-break: break-all; }
  .profile .role { display: inline-block; margin-top: 8px; padding: 3px 12px; border-radius: 999px; background: var(--brand-soft); color: var(--brand);
    font-size: 13px; font-weight: 700; }
  .profile .pbtns { display: flex; gap: 8px; margin-top: 16px; }
  .profile .pbtns .btn { margin: 0; }
  /* Bell: new comments from other people */
  header .bell { position: relative; background: none; border: 0; color: #fff; padding: 6px; display: grid; place-items: center; }
  header .bell svg { width: 24px; height: 24px; }
  header .bell .count { position: absolute; top: 0; right: -2px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px;
    background: #ef4444; color: #fff; font-size: 11px; font-weight: 800; line-height: 15px; text-align: center; border: 2px solid var(--header); }
  header .bell .count[hidden] { display: none; }
  header .bell .count.at { background: #94ba65; color: #10200a; }   /* new @mentions of you */
  /* The bell rings when someone @mentions you */
  header .bell.ring svg { animation: bellRing 1s ease-in-out 2; transform-origin: 50% 8%; }
  @keyframes bellRing {
    0%, 100% { transform: rotate(0); } 10% { transform: rotate(16deg); } 20% { transform: rotate(-14deg); } 30% { transform: rotate(11deg); }
    40% { transform: rotate(-8deg); } 50% { transform: rotate(5deg); } 60% { transform: rotate(-3deg); } 70% { transform: rotate(0); }
  }
  /* Phones (big ones too): tighten the header so logo, title and buttons stay on one line */
  @media (max-width: 480px) {
    header h1 { font-size: 18px; gap: 6px; }
    header .brand { gap: 7px; }
    header .logo .wordmark { height: 26px; }
    header .bot-name { gap: 5px; padding-left: 7px; }
    header .bot { height: 26px; }
    header .bot-text b { font-size: 18px; }
    header .hdr-actions { gap: 0; }
    header .add-item { padding: 8px 12px; font-size: 14px; margin-right: 2px; }
    header .bell { padding: 6px 4px; }
    header .refresh { padding: 4px 2px 4px 4px; }
    header .me-btn { width: 28px; height: 28px; }
  }
  @media (max-width: 340px) {   /* smallest phones: a slightly smaller logo and robot leave room for the name */
    header .logo .wordmark { height: 22px; }
    header .bot { height: 22px; }
    header .brand { gap: 5px; }
  }
  @media (max-width: 359px) {   /* smallest phones (e.g. iPhone SE 1st gen): "+ New" */
    header .add-item .long { display: none; }
  }
  header .brand > span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .note { background: var(--bg); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  .note.new { background: var(--brand-soft); }
  .note .t { font-weight: 700; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .note .t .badge { margin-top: 0; }
  .note .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; flex: none; }
  .note .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .note .body { margin-top: 6px; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .note .open { margin-top: 6px; padding: 6px 0; border: 0; background: none; color: var(--brand); font-size: 14px; font-weight: 700; }
  .note .gone { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .comment.flash { animation: flash 2.4s ease-out; }
  @keyframes flash { 0%, 50% { box-shadow: inset 0 0 0 2px var(--brand); } 100% { box-shadow: inset 0 0 0 2px transparent; } }
  .search { width: 100%; padding: 12px 14px; border: 0; border-radius: 12px; font-size: 16px;
    background: rgba(255,255,255,.95); color: #111; }
  /* Category filter */

    transition: opacity .18s ease, visibility 0s linear .18s; }

  .photo .with-photo :is(.photo-img, path) { pointer-events: auto; cursor: zoom-in; }   /* tap the logo or the photo: full screen */

  @keyframes photoMarkBreathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  /* The photo's intro (photoIntroAttrs): logo small in the middle → bolt sparks and shrinks → photo grows out of it

  .photo .intro :is(.mark-ring, .mark-photo, .mark-bolt) { animation: 1.1s var(--intro-at, 0ms) both; }
  .photo .intro .mark-ring { animation-name: introRing; animation-timing-function: cubic-bezier(.3, 0, .2, 1); }
  .photo .intro .mark-photo { animation-name: introPhoto; animation-timing-function: cubic-bezier(.3, 0, .2, 1); }
  .photo .intro .mark-bolt { animation-name: introBolt; animation-timing-function: ease-in-out; }
  @keyframes introRing { 0%, 32% { transform: scale(.55) rotate(0deg); } 88% { transform: scale(1.04) rotate(360deg); }
    100% { transform: scale(1) rotate(360deg); } }   /* one full turn while opening up, ending exactly where it rests */
  @keyframes introPhoto { 0%, 34% { transform: scale(.1); opacity: 0; } 50% { opacity: 1; } 88% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes introBolt { 0% { transform: scale(.55); opacity: 1; filter: none; }
    22% { transform: scale(.66); opacity: 1; filter: drop-shadow(0 0 3px #d9f99d) brightness(1.35); }
    32% { transform: scale(.55); opacity: 1; filter: none; } 55% { transform: scale(.05); opacity: 0; } 100% { transform: scale(0); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .photo .loading-mark, .photo .intro :is(.mark-ring, .mark-photo, .mark-bolt) { animation: none; } }
  /* Photo hover (mouse and trackpad only; phones and tablets keep tap-to-open): while the pointer is on the picture
     (photoHover adds .hov), the effect picked in Photo hover plays (html[data-phover]). */
  @media (hover: hover) and (pointer: fine) {
    .photo .with-photo { transition: transform .45s cubic-bezier(.2, .8, .2, 1), filter .45s; transform-origin: 50% 50%; }
    .photo .with-photo :is(.photo-img, .mark-ring, .mark-ring path) { transition: transform .5s cubic-bezier(.2, .8, .2, 1), opacity .35s; }
    .photo .photo-img { transform-box: view-box; transform-origin: 346px 35px; }
    .photo .mark-ring path { transform-box: view-box; transform-origin: 346px 35px; }
    .photo.hov .intro :is(.mark-ring, .mark-photo, .mark-bolt) { animation: none; }   /* hovering ends the opening animation at its resting look */
    :root[data-phover="zoom"] .photo.hov .photo-img { transform: scale(1.32); }
    :root[data-phover="lift"] .photo.hov .with-photo { transform: translateY(-7px) scale(1.04); filter: drop-shadow(0 14px 16px rgba(0,0,0,.35)); }
    :root[data-phover="spin"] .photo.hov .mark-ring { transform: rotate(180deg) scale(1.06); }
    :root[data-phover="spin"] .photo.hov .photo-img { transform: scale(1.1); }
    :root[data-phover="reveal"] .photo.hov .mark-ring path:first-child { transform: translate(-7px, 3px); opacity: 0; }
    :root[data-phover="reveal"] .photo.hov .mark-ring path:last-child { transform: translate(7px, -3px); opacity: 0; }
    :root[data-phover="reveal"] .photo.hov .photo-img { transform: scale(1.06); }
    /* Unframe: the brackets slide apart and fade while the whole photo opens out of the logo's window to its real shape */
    :root[data-phover="unframe"] .photo.hov .photo-real { opacity: 1; clip-path: inset(0 round 12px); }
    :root[data-phover="unframe"] .photo.hov .mark-ring path:first-child { transform: translate(-9px, 4px); opacity: 0; }
    :root[data-phover="unframe"] .photo.hov .mark-ring path:last-child { transform: translate(9px, -4px); opacity: 0; }
    :root[data-phover="unframe"] .photo.hov .mark-photo { opacity: 0; transition: opacity .2s .1s; }
    :root[data-phover="unframe"] .photo.hov { cursor: zoom-in; }
    /* Toss: the photo (in its logo frame) shrinks to a little icon, is thrown up in a spinning arc and bounces into the

  /* ---------- 🖼 Wallpaper (applyWallpaper): a fixed layer behind the whole app ---------- */
  html.has-wall body { background: transparent; }
  #wallpaper { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  #wallpaper .wp-img { position: absolute; inset: -30px; background-repeat: repeat; }
  #wallpaper .wp-img.wp-photo, #wallpaper .wp-img.wp-sky { background-size: cover; background-position: center; background-repeat: no-repeat; }
  #wallpaper .wp-dim { position: absolute; inset: 0; }
  .wp-aurora, .wp-mesh { overflow: hidden; }
  .wp-aurora::before { content: ''; position: absolute; inset: -40%; animation: wpAurora 22s ease-in-out infinite alternate;
    background: radial-gradient(30% 28% at 25% 30%, color-mix(in srgb, var(--wp-c1, #94ba65) 60%, transparent), transparent 70%),
      radial-gradient(34% 30% at 75% 40%, color-mix(in srgb, var(--wp-c2, #d9ae4f) 55%, transparent), transparent 70%),
      radial-gradient(36% 32% at 50% 80%, rgba(63, 182, 255, .28), transparent 70%); }
  @keyframes wpAurora { 0% { transform: translate(0, 0) rotate(0deg); } 100% { transform: translate(8%, -6%) rotate(12deg); } }
  .wp-mesh { background: radial-gradient(60% 50% at 0% 0%, color-mix(in srgb, var(--wp-c1, #cfe7a8) 55%, transparent), transparent 60%),
      radial-gradient(60% 60% at 100% 10%, color-mix(in srgb, var(--wp-c2, #f3d98a) 50%, transparent), transparent 60%),
      radial-gradient(70% 60% at 30% 100%, color-mix(in srgb, var(--wp-c1, #9fd0b8) 35%, transparent), transparent 60%); }
  .wp-evcar { background: linear-gradient(180deg, transparent 55%, color-mix(in srgb, var(--wp-c1, #94ba65) 14%, transparent) 100%); }
  /* 🚗 EV on the road: drives in (0–30%), charges at the charger (30–62%), drives off (62–92%), 15 s round */
  #wallpaper .wp-scene { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 84px); height: 22vh; max-height: 200px; }
  .ev-stage { position: absolute; left: 50%; bottom: 0; width: 1200px; height: 200px; margin-left: -600px; transform-origin: 50% 100%; }
  .ev-stage > *, .ev-car > * { position: absolute; }
  .ev-road { left: 0; right: 0; top: 188px; height: 3px; background: color-mix(in srgb, var(--text) 30%, transparent); }
  .ev-lane { left: 0; right: 0; top: 196px; height: 3px; overflow: hidden; }
  .ev-lane i { position: absolute; left: 0; top: 0; width: 1680px; height: 3px; will-change: transform; animation: evLane 15s cubic-bezier(.45, 0, .55, 1) infinite;
    background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--text) 22%, transparent) 0 26px, transparent 26px 48px); }
  .ev-charger { left: 640px; top: 103px; width: 34px; height: 86px; }
  .ev-charger rect { fill: color-mix(in srgb, var(--text) 26%, transparent); } .ev-charger .scr { fill: color-mix(in srgb, var(--wp-c1, #94ba65) 70%, transparent); } .ev-charger .bolt { fill: var(--wp-c1, #94ba65); }
  .ev-cable { left: 670px; top: 141px; width: 90px; height: 60px; opacity: 0; animation: evShow 15s linear infinite; }
  .ev-cable path { fill: none; stroke: color-mix(in srgb, var(--text) 40%, transparent); stroke-width: 4; stroke-linecap: round; }
  .ev-car { left: 0; top: 0; width: 540px; height: 190px; will-change: transform; animation: evDrive 15s cubic-bezier(.45, 0, .55, 1) infinite; }
  .ev-body { left: 0; top: 0; width: 540px; height: 190px; overflow: visible; }
  .ev-body .paint { fill: color-mix(in srgb, var(--wp-c1, #94ba65) 75%, var(--text) 10%); } .ev-body .glass { fill: color-mix(in srgb, var(--bg) 70%, #9fd3ff 30%); opacity: .85; }
  .ev-body .light { fill: #fff6c8; } .ev-body .beam { fill: #fff6c8; opacity: .18; } .ev-body .plug { fill: color-mix(in srgb, var(--text) 50%, transparent); }
  .ev-w1, .ev-w2 { top: 146px; width: 44px; height: 44px; } .ev-w1 { left: 64px; } .ev-w2 { left: 260px; }
  .ev-wheel { width: 44px; height: 44px; will-change: transform; animation: evWheel 15s cubic-bezier(.45, 0, .55, 1) infinite; }
  .ev-wheel svg { width: 44px; height: 44px; display: block; } .ev-wheel circle { fill: color-mix(in srgb, var(--text) 75%, #000 25%); }
  .ev-wheel path { stroke: color-mix(in srgb, var(--bg) 70%, transparent); stroke-width: 3; }
  .ev-charge { left: 158px; top: 26px; width: 64px; height: 60px; opacity: 0; animation: evShow 15s linear infinite; }
  .ev-charge svg { width: 64px; height: 60px; overflow: visible; } .ev-charge path { fill: var(--wp-c1, #94ba65); filter: drop-shadow(0 0 6px var(--wp-c1, #94ba65)); }
  .ev-charge rect { fill: none; stroke: color-mix(in srgb, var(--text) 45%, transparent); stroke-width: 2; }
  .ev-charge b { position: absolute; left: 4px; top: 4px; width: 56px; height: 8px; border-radius: 4px; background: var(--wp-c1, #94ba65); transform-origin: left center; animation: evFill 15s linear infinite; }
  @keyframes evDrive { 0% { transform: translate3d(-420px, 0, 0); } 30%, 62% { transform: translate3d(680px, 0, 0); } 92%, 100% { transform: translate3d(1300px, 0, 0); } }
  @keyframes evWheel { 0% { transform: rotate(0deg); } 30%, 62% { transform: rotate(1100deg); } 92%, 100% { transform: rotate(2400deg); } }
  @keyframes evShow { 0%, 31% { opacity: 0; } 35%, 58% { opacity: 1; } 61%, 100% { opacity: 0; } }
  @keyframes evFill { 0%, 34% { transform: scaleX(.12); } 58%, 100% { transform: scaleX(1); } }
  @keyframes evLane { 0%, 62% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-480px, 0, 0); } }
  @media (prefers-reduced-motion: reduce) {
    .wp-aurora::before, .ev-car, .ev-wheel, .ev-lane i, .ev-cable, .ev-charge, .ev-charge b { animation: none !important; }
    .ev-car { transform: translate3d(680px, 0, 0); } .ev-cable, .ev-charge { opacity: 1; }
  }

  /* EV: instrument panel. Square readouts with a spark-lime top edge, digital-style labels, glowing headline figures. */
  :root[data-skin="ev"] .facts.tiles { gap: 6px; }
  :root[data-skin="ev"] .facts.tiles .fact { border-radius: 6px; box-shadow: none; border-top: 3px solid var(--spark); padding: 8px 10px 9px; }
  :root[data-skin="ev"] .facts.tiles .fact dt { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; letter-spacing: .1em; }
  :root[data-skin="ev"] .facts.tiles .fact dd { font-variant-numeric: tabular-nums; }
  :root[data-skin="ev"] .facts.tiles .fact.hero { background: var(--bg); border-color: var(--line); border-top-color: var(--brand); }
  :root[data-skin="ev"] .facts.tiles .fact.hero dd { text-shadow: 0 0 12px color-mix(in srgb, var(--spark) 55%, transparent); }

  /* EnviroSpark: two-across cards with a green top edge, the label (with its icon in a soft green circle) over the value. */
  :root[data-skin="site"] .facts.tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  :root[data-skin="site"] .facts.tiles .fact { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--spark); border-radius: 12px;
    box-shadow: 0 1px 3px rgba(1, 24, 62, .06); padding: 9px 12px 10px; }
  :root[data-skin="site"] .facts.tiles .fact dt { gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: .06em; }
  :root[data-skin="site"] .facts.tiles .fact .ic { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--brand-soft); font-size: 12px; }
  :root[data-skin="site"] .facts.tiles .fact dd { margin-top: 5px; font-size: 16px; }
  :root[data-skin="site"] .facts.tiles .fact.hero { border-top-color: var(--brand); background: linear-gradient(160deg, var(--brand-soft), var(--card) 75%); }
  :root[data-skin="site"] .facts.tiles .fact.hero dd { font-size: 21px; }

  /* Girl Power: bubbles. Round, centred cards with the icon in a little circle. */
  :root[data-skin="girl"] .facts.tiles { gap: 10px; }
  :root[data-skin="girl"] .facts.tiles .fact { border-radius: 24px; border: 2px solid var(--brand-soft); box-shadow: none; text-align: center; padding: 12px 10px; }
  :root[data-skin="girl"] .facts.tiles .fact dt { flex-direction: column; justify-content: center; gap: 5px; text-transform: none; letter-spacing: 0; font-size: 12px; }
  :root[data-skin="girl"] .facts.tiles .fact .ic { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); display: grid; place-items: center; font-size: 14px; }
  :root[data-skin="girl"] .facts.tiles .fact.hero { border-color: var(--brand); background: linear-gradient(160deg, var(--brand-soft), var(--card)); }

  /* White Glass: floating frosted cards, icon in a glass circle above the label. */
  :root[data-skin="glass"] .facts.tiles { gap: 10px; }
  :root[data-skin="glass"] .facts.tiles .fact { background: var(--glass); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid var(--glass-edge); border-radius: 18px; box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-edge); padding: 12px; }
  :root[data-skin="glass"] .facts.tiles .fact dt { flex-direction: column; align-items: flex-start; gap: 7px; }
  :root[data-skin="glass"] .facts.tiles .fact .ic { width: 30px; height: 30px; border-radius: 50%; background: var(--glass-edge); display: grid; place-items: center; font-size: 15px; }
  :root[data-skin="glass"] .facts.tiles .fact.hero { background: linear-gradient(160deg, var(--glass-edge), var(--glass)); }

  /* Black Glass: one smoky-glass data table. Label on the left, value on the right, hairline rows. */
  :root[data-skin="black"] .facts.tiles { display: block; border: 1px solid var(--glass-edge); border-radius: 16px; overflow: hidden; background: var(--glass);
    -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); box-shadow: var(--glass-shadow); }
  :root[data-skin="black"] .facts.tiles .fact { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 9px 14px;
    background: none; border: 0; border-bottom: 1px solid var(--glass-edge); border-radius: 0; box-shadow: none; }
  :root[data-skin="black"] .facts.tiles .fact:last-child { border-bottom: 0; }
  :root[data-skin="black"] .facts.tiles .fact dt { flex: none; font-size: 13px; font-weight: 500; text-transform: none; letter-spacing: 0; }
  :root[data-skin="black"] .facts.tiles .fact dd { margin: 0; text-align: right; }
  :root[data-skin="black"] .facts.tiles .fact.hero { background: rgba(255, 255, 255, .05); }
  :root[data-skin="black"] .facts.tiles .fact.hero dd { font-size: 19px; }

  /* Georgia Bulldogs: scoreboard. Bold capitals, red side bars; the money and weight figures on black boards. */
  :root[data-skin="gold"] .facts.tiles .fact { border: 1px solid var(--line); border-top: 2px solid var(--spark); border-radius: 10px; }
  :root[data-skin="gold"] .facts.tiles .fact dt { letter-spacing: .14em; color: var(--brand); }
  :root[data-skin="gold"] .facts.tiles .fact.hero { background: linear-gradient(135deg, #2a2112, #17130c); border: 1px solid #5a4719; border-top: 2px solid var(--spark); }
  :root[data-skin="gold"] .facts.tiles .fact.hero dt, :root[data-skin="gold"] .facts.tiles .fact.hero dd small { color: #d8c48f; }
  :root[data-skin="gold"] .facts.tiles .fact.hero dd { color: #f6dc84; }
  :root[data-skin="uga"] .facts.tiles { gap: 6px; }
  :root[data-skin="uga"] .facts.tiles .fact { border: 0; border-left: 5px solid var(--spark); border-radius: 4px; box-shadow: none; }
  :root[data-skin="uga"] .facts.tiles .fact dt { font-weight: 900; letter-spacing: .12em; color: var(--text); }
  :root[data-skin="uga"] .facts.tiles .fact dd { font-weight: 900; text-transform: uppercase; }
  :root[data-skin="uga"] .facts.tiles .fact.hero { background: #000; border: 1px solid #333; border-left: 5px solid var(--spark); }
  :root[data-skin="uga"] .facts.tiles .fact.hero dt, :root[data-skin="uga"] .facts.tiles .fact.hero dd small { color: rgba(255, 255, 255, .7); }
  :root[data-skin="uga"] .facts.tiles .fact.hero dd { color: #fff; font-size: 24px; }

  /* Modern: bento grid. Soft cards; the first headline figure spans the full width with a big number. */
  :root[data-skin="modern"] .facts.tiles .fact { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--m-shadow); padding: 12px 14px; }
  :root[data-skin="modern"] .facts.tiles .fact.hero { background: linear-gradient(135deg, var(--brand-soft), var(--card) 80%); border-color: var(--brand-soft); }
  :root[data-skin="modern"] .facts.tiles .fact.hero:first-child { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  :root[data-skin="modern"] .facts.tiles .fact.hero:first-child dd { margin: 0; text-align: right; font-size: 30px; }

  /* Simple: a plain two-column list (label, value), no cards, fast to draw. */
  :root[data-skin="simple"] .facts.tiles { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
  :root[data-skin="simple"] .facts.tiles .fact { display: contents; }
  :root[data-skin="simple"] .facts.tiles .fact .ic { display: none; }
  :root[data-skin="simple"] .facts.tiles .fact dt { font-size: 13px; font-weight: 500; text-transform: none; letter-spacing: 0; }
  :root[data-skin="simple"] .facts.tiles .fact dd { margin: 0; font-size: 14px; font-weight: 600; }
  :root[data-skin="simple"] .facts.tiles .fact dd small { display: inline; margin-left: 6px; }
  :root[data-skin="simple"] .facts.tiles .fact.hero dd { font-size: 15px; }

  /* ---------- An order's ITEMS section, styled like each theme's Details ----------
     Each item row (tr.oi, plus its endpoints row when it has one) is drawn as a card / row from these variables; the
     to-ship and cost totals take the theme's highlighted-figure look. */
  .oitems { --oi-bg: var(--bg); --oi-bd: 1px solid var(--line); --oi-r: 14px; --oi-sh: inset 3px 0 0 var(--brand); --oi-gap: 8px; }
  .oitems .otable, .oitems .otable tbody { display: block; }
  .oitems .otable tr { display: grid; grid-template-columns: minmax(0, 1fr) 40px 78px 86px; gap: 0 4px; align-items: start; }
  .oitems .otable th, .oitems .otable td { border-bottom: 0; }
  .oitems .otable tr.oh th { padding: 0 10px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .oitems .otable tr.oi { padding: 8px 6px; background: var(--oi-bg); border: var(--oi-bd); border-radius: var(--oi-r); box-shadow: var(--oi-sh); margin-bottom: var(--oi-gap); }
  .oitems .otable tr.oi:has(+ tr.lep-row) { margin-bottom: 0; border-bottom: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .oitems .otable tr.lep-row { display: block; padding: 0 10px 10px; background: var(--oi-bg); border: var(--oi-bd); border-top: 0;
    border-radius: 0 0 var(--oi-r) var(--oi-r); box-shadow: var(--oi-sh); margin-bottom: var(--oi-gap); }
  .oitems .otable tr.lep-row td { display: block; padding: 0; }
  .oitems .ototals { border-radius: 14px; }

  :root[data-skin="ev"] .oitems { --oi-r: 6px; --oi-sh: none; }
  :root[data-skin="ev"] .oitems .otable tr.oi { border-top: 3px solid var(--spark); }
  :root[data-skin="ev"] .oitems .otable tr.oh th { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; letter-spacing: .1em; }
  :root[data-skin="ev"] .oitems .otable td { font-variant-numeric: tabular-nums; }
  :root[data-skin="ev"] .oitems .ototals { border-radius: 6px; background: var(--bg); border: 1px solid var(--line); border-top: 3px solid var(--brand); }
  :root[data-skin="ev"] .oitems .ototals b { color: var(--brand); text-shadow: 0 0 12px color-mix(in srgb, var(--spark) 55%, transparent); }

  :root[data-skin="site"] .oitems { --oi-bg: transparent; --oi-bd: 0; --oi-r: 0; --oi-sh: none; --oi-gap: 0; }
  :root[data-skin="site"] .oitems .otable tr.oi, :root[data-skin="site"] .oitems .otable tr.lep-row { border-bottom: 1px dashed var(--line); }
  :root[data-skin="site"] .oitems .otable tr.oh th { font-size: 13px; font-weight: 600; text-transform: none; letter-spacing: 0; }
  :root[data-skin="site"] .oitems .ototals { border-radius: 12px; border-left: 4px solid var(--spark); background: linear-gradient(90deg, var(--brand-soft), transparent); }
  :root[data-skin="site"] .oitems .ototals b { font-size: 21px; }

  :root[data-skin="girl"] .oitems { --oi-bg: var(--card); --oi-bd: 2px solid var(--brand-soft); --oi-r: 22px; --oi-sh: none; --oi-gap: 10px; }
  :root[data-skin="girl"] .oitems .otable tr.oh th { text-transform: none; letter-spacing: 0; font-size: 12px; }
  :root[data-skin="girl"] .oitems .ototals { border-radius: 22px; border: 2px solid var(--brand); background: linear-gradient(160deg, var(--brand-soft), var(--card)); }

  :root[data-skin="glass"] .oitems { --oi-bg: var(--glass); --oi-bd: 1px solid var(--glass-edge); --oi-r: 18px; --oi-sh: var(--glass-shadow), inset 0 1px 0 var(--glass-edge); --oi-gap: 10px; }
  :root[data-skin="glass"] .oitems .otable tr.oi, :root[data-skin="glass"] .oitems .otable tr.lep-row {
    -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); }
  :root[data-skin="glass"] .oitems .ototals { border-radius: 18px; border: 1px solid var(--glass-edge); background: linear-gradient(160deg, var(--glass-edge), var(--glass));
    box-shadow: var(--glass-shadow); }

  :root[data-skin="black"] .oitems { --oi-bg: transparent; --oi-bd: 0; --oi-r: 0; --oi-sh: none; --oi-gap: 0; }
  :root[data-skin="black"] .oitems .otable { border: 1px solid var(--glass-edge); border-radius: 16px; overflow: hidden; background: var(--glass);
    -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); box-shadow: var(--glass-shadow); }
  :root[data-skin="black"] .oitems .otable tr.oh { padding-top: 10px; border-bottom: 1px solid var(--glass-edge); }
  :root[data-skin="black"] .oitems .otable tr.oi, :root[data-skin="black"] .oitems .otable tr.lep-row { border-bottom: 1px solid var(--glass-edge); }
  :root[data-skin="black"] .oitems .otable tr:last-child { border-bottom: 0; }
  :root[data-skin="black"] .oitems .ototals { border-radius: 14px; border: 1px solid var(--glass-edge); background: rgba(255, 255, 255, .05); }

  :root[data-skin="gold"] .oitems { --oi-bd: 1px solid var(--line); --oi-r: 10px; --oi-sh: inset 0 2px 0 var(--spark); }
  :root[data-skin="gold"] .oitems .ototals { border-radius: 10px; background: linear-gradient(135deg, #2a2112, #17130c); color: #d8c48f; border: 1px solid #5a4719; }
  :root[data-skin="gold"] .oitems .ototals b { color: #f6dc84; }
  :root[data-skin="uga"] .oitems { --oi-bd: 0; --oi-r: 4px; --oi-sh: inset 5px 0 0 var(--spark); --oi-gap: 6px; }
  :root[data-skin="uga"] .oitems .otable tr.oh th { font-weight: 900; letter-spacing: .12em; color: var(--text); }
  :root[data-skin="uga"] .oitems .otable tr.oi td b { font-weight: 900; text-transform: uppercase; }
  :root[data-skin="uga"] .oitems .ototals { border-radius: 4px; background: #000; color: rgba(255, 255, 255, .75); border: 1px solid #333; border-left: 5px solid var(--spark); }
  :root[data-skin="uga"] .oitems .ototals b { color: #fff; font-weight: 900; }

  :root[data-skin="modern"] .oitems { --oi-bg: var(--card); --oi-bd: 1px solid var(--line); --oi-r: 18px; --oi-sh: var(--m-shadow); --oi-gap: 10px; }
  :root[data-skin="modern"] .oitems .ototals { border-radius: 18px; background: linear-gradient(135deg, var(--brand-soft), var(--card) 80%); border: 1px solid var(--brand-soft);
    box-shadow: var(--m-shadow); }
  :root[data-skin="modern"] .oitems .ototals b { font-size: 22px; color: var(--brand); }

  :root[data-skin="simple"] .oitems { --oi-bg: transparent; --oi-bd: 0; --oi-r: 0; --oi-sh: none; --oi-gap: 0; }
  :root[data-skin="simple"] .oitems .otable tr.oi, :root[data-skin="simple"] .oitems .otable tr.lep-row { border-bottom: 1px solid var(--line); }

  /* Scanner overlay */
  .scanner { position: fixed; inset: 0; z-index: 30; background: #000; color: #fff; display: none; flex-direction: column; }
  .scanner.open { display: flex; }
  .scanner .top { display: flex; justify-content: space-between; align-items: center;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; }
  .scanner .top button { background: none; border: 0; color: #fff; font-size: 17px; padding: 6px; }
  .scanner .status.flash { background: rgba(22, 163, 74, .9); color: #fff; font-weight: 700; }
  .scanner .status.flash.bad { background: rgba(185, 28, 28, .9); }
  .scanner .view { position: relative; flex: 1; overflow: hidden; display: grid; place-items: center; }
  .scanner video { width: 100%; height: 100%; object-fit: cover; }
  .scanner .frame { position: absolute; width: 72%; max-width: 320px; aspect-ratio: 1.4; border: 3px solid rgba(255,255,255,.9);
    border-radius: 16px; box-shadow: 0 0 0 9999px rgba(0,0,0,.4); pointer-events: none; }
  .scanner .status { position: absolute; top: 14px; left: 16px; right: 16px; text-align: center; font-size: 14px;
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; }
  .scanner .fallback { text-align: center; padding: 24px; display: none; }
  .scanner .fallback p { color: #d1d5db; }
  .scanner .bottom { padding: 14px 16px calc(env(safe-area-inset-bottom) + 16px); background: #111; }
  .scanner .bottom .hint { font-size: 13px; color: #9ca3af; text-align: center; margin-bottom: 10px; }
  .scanner .bottom .field { background: #1f2937; border-color: #374151; color: #fff; }
  .scanner .photo-btn { margin-top: 10px; width: 100%; padding: 14px; border-radius: 12px; border: 0; background: var(--brand); color: var(--on-brand, #fff); font-weight: 600; }

  .badge.job { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .pick { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--bg); border: 0; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .pick .t { font-weight: 600; } .pick .s { font-size: 13px; color: var(--muted); }
  .pick .n { font-size: 22px; font-weight: 800; min-width: 40px; text-align: right; }
  /* Attached PDFs */
  .doc { display: flex; align-items: center; gap: 10px; background: var(--bg); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
  .doc a { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; }
  .doc .ico { flex: none; width: 34px; height: 40px; border-radius: 6px; background: #dc2626; color: #fff; font-size: 10px; font-weight: 800;
    display: grid; place-items: center; letter-spacing: .02em; }
  .doc .nm { font-weight: 600; word-break: break-word; }
  .doc .sub { font-size: 12px; color: var(--muted); }
  .doc .dmove { flex: none; display: flex; flex-direction: column; margin: -4px -2px -4px -6px; }
  .doc .dmove button { background: none; border: 0; padding: 2px 6px; font-size: 15px; line-height: 1.1; color: var(--brand); font-weight: 800; }
  .doc .dmove button:disabled { opacity: .25; }
  .doc .rm { flex: none; background: none; border: 0; color: var(--muted); font-size: 18px; padding: 6px; }
  .attach-btn { width: 100%; margin-top: 8px; padding: 12px; border-radius: 12px; border: 2px dashed var(--line); background: none;
    color: var(--brand); font-weight: 700; font-size: 15px; }
  .comment-compose { display: flex; gap: 8px; align-items: flex-end; position: relative; }
  /* @mentions: the people list that opens under the comment box while typing @name, and the tags in comments */
  .mention-box { position: absolute; left: 0; top: 100%; z-index: 20; width: min(330px, 100%); margin-top: 4px; padding: 4px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .mention-box button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px; border: 0; border-radius: 8px;
    background: none; text-align: left; color: var(--text); }
  .mention-box button.on { background: var(--brand-soft); }
  .mention-box .mn { font-weight: 700; font-size: 14px; } .mention-box .me { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .mention-box .cav { margin-right: 0; }
  .live { display: flex; align-items: center; gap: 8px; margin: -2px 0 8px; font-size: 12px; color: var(--muted); }
  .live b { color: var(--text); }
  .live .dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
  .live .dot::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: rgba(34,197,94,.55); animation: livePulse 2s infinite; }
  @keyframes livePulse { 0% { transform: scale(1); opacity: 1; } 70% { transform: scale(2.75); opacity: 0; } 100% { transform: scale(1); opacity: 0; } }
  .live button { margin-left: auto; background: none; border: 0; padding: 4px 0; color: var(--brand); font-weight: 700; font-size: 12px; }
  .live-chg { font-size: 12px; padding: 6px 10px; margin-bottom: 6px; border-radius: 10px; background: var(--warn-soft, #fef3c7); color: var(--warn, #b45309); }
  .live-edit { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--warn, #b45309); }
  .mention-status { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
  .mchip { display: inline-flex; align-items: center; gap: 2px; padding: 3px 10px 3px 4px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .mchip .cav { width: 20px; height: 20px; font-size: 9px; margin-right: 5px; }
  .mchip.ok { background: var(--brand-soft); color: var(--brand); }
  .mchip.bad { padding-left: 10px; background: var(--warn-soft, #fef3c7); color: var(--warn, #b45309); }
  .mention { color: var(--brand); font-weight: 700; background: var(--brand-soft); border-radius: 6px; padding: 0 4px; }
  .mention.you { color: var(--on-brand, #fff); background: var(--brand); }
  .note .tagme { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--brand); color: var(--on-brand, #fff); }
  .mc-seg { display: flex; gap: 6px; margin: 0 0 10px; }
  .mc-seg button { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: 13px; color: var(--text); }
  .mc-seg button.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand, #fff); }
  .comment-compose textarea { flex: 1; resize: vertical; min-height: 46px; }
  .comment-compose .btn { flex: none; padding: 12px 16px; }
  .comment { background: var(--bg); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
  .comment .who { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .comment .who button { background: none; border: 0; padding: 2px 0; font-size: 12px; font-weight: 600; color: var(--danger); }
  .comment .text { margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  /* Emoji reactions */
  .rxs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .rx { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 15px; line-height: 1.3; }
  .rx b { font-size: 12px; font-weight: 700; color: var(--muted); }
  .rx.on { border-color: var(--brand); background: var(--brand-soft); }
  .rx.on b { color: var(--brand); }
  .rx.add, .rx.who { color: var(--muted); font-size: 14px; }
  .rx.add small { font-size: 11px; margin-left: -2px; }
  .rx.who.on { border-color: var(--brand); }

  /* ---------- Classic theme: outlined buttons ----------
     Buttons all through the app are drawn as an outline in the accent colour (black; white in dark mode) with text to
     match on no colour; the accent only fills in behind a
     button while it's hovered (mouse), pressed (tap), or switched on (a chosen filter, tab or choice). Danger buttons do the
     same in red; plain "ghost" buttons (Close, Back…) have a grey outline. */
  :root:not([data-skin]) { --ol-fill-text: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-skin]) { --ol-fill-text: #111; } }
  :root:not([data-skin]) .btn.primary,
  :root:not([data-skin]) .stepnav button,
  :root:not([data-skin]) .otool,
  :root:not([data-skin]) .attach-btn,
  :root:not([data-skin]) .arrange-btn,
  :root:not([data-skin]) .cat-toggle,
  :root:not([data-skin]) .ep-toggle,
  :root:not([data-skin]) .pic-pick,
  :root:not([data-skin]) .catbtn,
  :root:not([data-skin]) .chip:not(.tc),
  :root:not([data-skin]) .users-btn,
  :root:not([data-skin]) .stepper button,
  :root:not([data-skin]) .big-qty button,
  :root:not([data-skin]) .sortbar select,
  :root:not([data-skin]) .picchoice,
  :root:not([data-skin]) .lchoice,
  :root:not([data-skin]) .icon-btn {
    background: transparent; border: 1.5px solid var(--brand); color: var(--brand);
    transition: background-color .15s, color .15s, border-color .15s, box-shadow .15s; }
  :root:not([data-skin]) .attach-btn { border-style: dashed; }
  :root:not([data-skin]) :is(.otool, .users-btn, .catbtn, .picchoice, .lchoice) { color: var(--text); }
  :root:not([data-skin]) :is(.otool, .users-btn) small { color: var(--muted); }
  :root:not([data-skin]) .btn.ghost { background: transparent; border: 1.5px solid color-mix(in srgb, var(--text) 35%, transparent); color: var(--text);
    transition: background-color .15s, color .15s, border-color .15s; }
  :root:not([data-skin]) .btn.danger { background: transparent; border: 1.5px solid var(--danger); color: var(--danger); transition: background-color .15s, color .15s; }
  :root:not([data-skin]) .stat { border: 1.5px solid var(--line); transition: border-color .15s, box-shadow .15s; }
  :root:not([data-skin]) .stat.active { border: 2px solid var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  /* switched on: filled */
  :root:not([data-skin]) :is(.chip:not(.tc).active, .cat-toggle.on, .ep-toggle.on, .picchoice.on, .lchoice.on) {
    background: var(--brand); border-color: var(--brand); color: var(--ol-fill-text); }
  :root:not([data-skin]) :is(.picchoice.on, .lchoice.on) small { color: inherit; }
  /* pressed (tap) everywhere, hovered with a mouse */
  :root:not([data-skin]) .btn.primary:active:not(:disabled),
  :root:not([data-skin]) .stepnav button:active:not(:disabled),
  :root:not([data-skin]) .otool:active:not(:disabled),
  :root:not([data-skin]) .attach-btn:active:not(:disabled),
  :root:not([data-skin]) .arrange-btn:active:not(:disabled),
  :root:not([data-skin]) .cat-toggle:active:not(:disabled),
  :root:not([data-skin]) .ep-toggle:active:not(:disabled),
  :root:not([data-skin]) .pic-pick:active:not(:disabled),
  :root:not([data-skin]) .catbtn:active:not(:disabled),
  :root:not([data-skin]) .chip:not(.tc):active:not(:disabled),
  :root:not([data-skin]) .users-btn:active:not(:disabled),
  :root:not([data-skin]) .stepper button:active:not(:disabled),
  :root:not([data-skin]) .big-qty button:active:not(:disabled),
  :root:not([data-skin]) .sortbar select:active:not(:disabled),
  :root:not([data-skin]) .picchoice:active:not(:disabled),
  :root:not([data-skin]) .lchoice:active:not(:disabled),
  :root:not([data-skin]) .icon-btn:active:not(:disabled),
  :root:not([data-skin]) .btn.ghost:active, :root:not([data-skin]) .stat:active { background: var(--brand); border-color: var(--brand); color: var(--ol-fill-text); }
  :root:not([data-skin]) .btn.danger:active { background: var(--danger); color: #fff; }
  @media (hover: hover) {
    :root:not([data-skin]) .btn.primary:hover:not(:disabled),
  :root:not([data-skin]) .stepnav button:hover:not(:disabled),
  :root:not([data-skin]) .otool:hover:not(:disabled),
  :root:not([data-skin]) .attach-btn:hover:not(:disabled),
  :root:not([data-skin]) .arrange-btn:hover:not(:disabled),
  :root:not([data-skin]) .cat-toggle:hover:not(:disabled),
  :root:not([data-skin]) .ep-toggle:hover:not(:disabled),
  :root:not([data-skin]) .pic-pick:hover:not(:disabled),
  :root:not([data-skin]) .catbtn:hover:not(:disabled),
  :root:not([data-skin]) .chip:not(.tc):hover:not(:disabled),
  :root:not([data-skin]) .users-btn:hover:not(:disabled),
  :root:not([data-skin]) .stepper button:hover:not(:disabled),
  :root:not([data-skin]) .big-qty button:hover:not(:disabled),
  :root:not([data-skin]) .sortbar select:hover:not(:disabled),
  :root:not([data-skin]) .picchoice:hover:not(:disabled),
  :root:not([data-skin]) .lchoice:hover:not(:disabled),
  :root:not([data-skin]) .icon-btn:hover:not(:disabled),
    :root:not([data-skin]) .btn.ghost:hover { background: var(--brand); border-color: var(--brand); color: var(--ol-fill-text); }
    :root:not([data-skin]) :is(.otool, .users-btn):hover small { color: inherit; }
    :root:not([data-skin]) .btn.danger:hover { background: var(--danger); color: #fff; }
    :root:not([data-skin]) .stat:hover { border-color: var(--brand); }
  }
  :root:not([data-skin]) :is(.btn, .chip, .stepper button, .big-qty button):disabled { opacity: .4; }

  /* ---------- Supplybot (botSvg): colours from the theme ---------- */
  .sb { display: block; fill: var(--text); overflow: visible; }

  .sb .sb-acc { stroke: var(--text); fill: none; }

  .sb .sb-sign rect:first-child { fill: var(--muted); } .sb .sb-tri { fill: #f59e0b; } .sb .sb-ex { fill: #111; }
  .sb .sb-drop { fill: #38bdf8; } .sb .sb-brow { stroke: var(--card); }
  .sb .sb-box rect:first-child { fill: #c08a4b; } .sb .sb-tape { fill: #e9c28c; } .sb .sb-line { stroke: #8a5f2c; stroke-width: 4; }
  .sb-bob { transform-box: fill-box; transform-origin: 50% 100%; }
  .sb-mini { display: inline-block; width: 1.25em; height: 1.25em; vertical-align: -.25em; margin-right: 4px; }
  .sb-empty { display: block; margin: 4px auto 10px; width: 78px; }
