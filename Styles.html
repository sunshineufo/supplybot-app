  :is(.tagdrop-list, .ep-panel, .cc-orders) .sb-empty { width: 42px; margin-bottom: 4px; }
  .sb-hint { display: flex; align-items: center; gap: 12px; }
  .sb-hint .sb { width: 52px; flex: none; }
  .toast.err { display: flex; align-items: center; gap: 6px; }
  .toast.err .sb-mini { width: 26px; height: 26px; flex: none; --text: #fff; --card: #b91c1c; }
  .toast.err .sb-mini .sb-screen { fill: #b91c1c; } .toast.err .sb-mini { fill: #fff; }
  .after.short .sb-mini { width: 1.35em; height: 1.35em; }
  @keyframes sbBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes sbBobR { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  /* success: Supplybot cheers in the middle of the screen with a confetti burst, then fades */
  .sb-party { position: fixed; left: 50%; top: 42%; z-index: 60; display: grid; justify-items: center; gap: 8px; padding: 18px 22px 14px; border-radius: 22px;
    background: var(--card); color: var(--text); box-shadow: 0 18px 40px -12px rgba(0,0,0,.45), 0 0 0 2px var(--brand-soft); pointer-events: none;
    transform: translate(-50%, -50%) scale(.6); opacity: 0; max-width: calc(100vw - 48px); text-align: center; }
  .sb-party.show { animation: sbParty 2.4s cubic-bezier(.2, 1.4, .4, 1) forwards; }
  .sb-party .sb { width: 92px; }
  .sb-party.show .sb-bob { animation: sbJump .5s .15s ease-out 2; }
  .sb-party b { font-size: 16px; font-weight: 800; }
  .sb-burst { position: absolute; left: 50%; top: 58px; width: 0; height: 0; }
  .sb-burst i { position: absolute; width: 8px; height: 12px; border-radius: 2px; background: var(--c); opacity: 0; transform: rotate(var(--a)) translateY(0); }
  .sb-party.show .sb-burst i { animation: sbConfetti .9s .1s ease-out forwards; }
  @keyframes sbParty { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 12%, 82% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -54%) scale(.96); } }
  @keyframes sbJump { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-16px); } }
  @keyframes sbConfetti { 0% { opacity: 1; transform: rotate(var(--a)) translateY(0); } 100% { opacity: 0; transform: rotate(var(--a)) translateY(calc(-1 * var(--d))) rotate(180deg); } }
  /* working on a PDF */
  .sb-working { display: flex; align-items: center; gap: 12px; padding: 8px 4px; font-weight: 600; color: var(--muted); }
  .sb-working .sb { width: 60px; flex: none; }
  .sb-working .sb-wrap { display: block; flex: none; width: 60px; animation: sbBobR 1s ease-in-out infinite; } .sb-working .sb-wrap .sb { width: 100%; display: block; }
  /* daily greeting */
  .sb-greet { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 92px); z-index: 45; display: flex; align-items: flex-start; gap: 12px;
    max-width: 460px; margin: 0 auto; padding: 14px 14px 12px; border-radius: 20px; background: var(--card); color: var(--text);
    box-shadow: 0 16px 40px -14px rgba(0,0,0,.5), 0 0 0 1.5px var(--brand-soft); transform: translateY(130%); opacity: 0; transition: transform .45s cubic-bezier(.2, 1.3, .4, 1), opacity .3s; }

  .sb-greet.top.show { transform: none; }
  .sg-q { display: flex; align-items: flex-start; gap: 6px; margin: 2px 0 4px; padding: 10px 12px; border-radius: 14px; font-size: 14px; line-height: 1.4; font-style: italic;
    background: linear-gradient(135deg, var(--brand-soft), transparent); border-left: 3px solid var(--brand); }
  .sg-q span { flex: 1; } .sg-q b { font-size: inherit; font-style: normal; }

  .minstock b { font-size: 14px; } .minstock small { display: block; font-size: 12px; color: var(--muted); } .minstock.low small:not(.ms-n) { color: var(--danger); font-weight: 700; }
  .minstock.ro { display: grid; gap: 2px; }
  .ms-t { flex: 1 1 180px; display: flex; align-items: center; gap: 10px; margin: 0; cursor: pointer; } .ms-t input { width: 20px; height: 20px; accent-color: var(--brand); flex: none; }
  .ms-q { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 13px; font-weight: 600; } .ms-q input { width: 76px; margin: 0; padding: 6px 8px; text-align: center; }
  .minstock:not(.on) .ms-q { opacity: .55; } .ms-n { flex-basis: 100%; }
  .sg-k { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; } .sg-k:empty { display: none; }

  header .bot-name { cursor: pointer; -webkit-tap-highlight-color: transparent; } header .bot-name:active .bot { transform: scale(.9) rotate(-6deg); }
  header .bot-name .bot { transition: transform .15s; }
  /* ---------- ⚡ Supplybot's entrance (botIntro, once each time the app opens) ----------
     The chest bolt strikes first (white-hot, the header flashes twice like lightning), jagged arcs crackle out of it
     with shockwave rings while the logo jolts, then the robot bursts out of the bolt flickering like power surging on,
     the eyes light up, the smile draws on, sparks jump to the antenna tips, and "Supplybot" flickers in. ~2.5 s.
     .bi-pre hides it until the show starts; the arcs (.bi-fx) are drawn fresh each time by botIntro, so no two are alike.
     Units inside the logo are its own (452 tall), so a 60-unit glow is only about 6 px on screen. */
  header .bot-name.bi-pre .bot, header .bot-name.bi-pre .bot-text { opacity: 0; }
  header .bot-name.bi-play .bot { overflow: visible; animation: biJolt .5s .14s steps(1, end) both; }
  header .bot-name.bi-play .bi-bolt { transform-box: fill-box; transform-origin: 50% 50%; animation: biBolt .9s cubic-bezier(.2, .9, .3, 1) both; }
  header .bot-name.bi-play .bi-body { transform-box: view-box; transform-origin: 152px 369px; animation: biBody .9s .55s cubic-bezier(.2, 1.3, .4, 1) both; }
  header .bot-name.bi-play .bi-body .eye { animation: biEyes .7s 1.3s steps(1, end) both; }
  header .bot-name.bi-play .bi-body .smile { stroke-dasharray: 80; animation: biSmile .45s 1.6s ease-out both; }
  header .bot-name.bi-play .bot-text b { animation: biText .75s 1.05s steps(1, end) both; }
  header .bot-name.bi-play .bot-text small { animation: biSub .5s 1.55s ease-out both; }
  header .bot-name.bi-play .bot-text small + small { animation-delay: 1.7s; }
  .bi-fx { pointer-events: none; }
  .bi-fx .bi-arc { fill: none; stroke: #efffd6; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; opacity: 0;
    filter: drop-shadow(0 0 10px #b6ff5c) drop-shadow(0 0 26px #7cd63a); animation: biArc var(--d, .32s) var(--t, 0s) linear both; }
  .bi-fx .bi-arc.thin { stroke-width: 5; }
  .bi-fx .bi-ring { fill: none; stroke: #d8ff9c; stroke-width: 10; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%;
    filter: drop-shadow(0 0 14px #9be04c); animation: biRing .7s var(--t, 0s) ease-out both; }
  .bi-fx .bi-spark { fill: #fff; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; filter: drop-shadow(0 0 12px #c8ff7a);
    animation: biSpark .45s var(--t, 0s) ease-out both; }
  .bi-flash { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0; mix-blend-mode: screen;
    background: radial-gradient(circle at var(--bx, 30%) 50%, rgba(255, 255, 255, .95), rgba(214, 255, 150, .55) 18%, rgba(148, 186, 101, .18) 45%, transparent 70%);
    animation: biFlash .75s .1s linear both; }
  @keyframes biBolt {
    0% { transform: scale(0); opacity: 0; fill: #fff; filter: drop-shadow(0 0 0 #fff); }
    12% { transform: scale(3); opacity: 1; fill: #fff; filter: drop-shadow(0 0 40px #fff) drop-shadow(0 0 90px #b6ff5c); }
    22% { transform: scale(1.2); } 28% { opacity: .25; } 33% { opacity: 1; } 40% { opacity: .5; } 44% { opacity: 1; fill: #f4ffd9; }
    55% { transform: scale(1.55); filter: drop-shadow(0 0 30px #e6ffb8) drop-shadow(0 0 70px #94ba65); }
    100% { transform: scale(1); opacity: 1; fill: #94ba65; filter: drop-shadow(0 0 0 transparent); } }
  @keyframes biBody {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    35% { transform: scale(1.18) rotate(4deg); opacity: 1; filter: brightness(2.4) drop-shadow(0 0 30px #c8ff7a); }
    45% { opacity: .35; } 50% { opacity: 1; } 56% { opacity: .55; } 60% { opacity: 1; filter: brightness(1.5) drop-shadow(0 0 16px #b6ff5c); }
    75% { transform: scale(.96) rotate(-1deg); }
    100% { transform: none; opacity: 1; filter: none; } }

  /* The phone's / browser's own drop-down lists (🖼 picture style, categories, sort, report choices…) and date pickers:
     tell the browser whether the app is light or dark, and give the list rows the theme's own card and text colours,
     so the choices are never white on white (or dark on dark). */
  :root { color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; } }
  select option, select optgroup { background-color: var(--card); color: var(--text); }
  .pic-pick select { background-color: var(--card); color: var(--text); }
  /* Smooth scrolling on computers. Cards on Glass and Black Glass blur the background behind them; that background
     doesn't move, so every card re-blurred it on every frame of scrolling (it looked the same: the blur of a smooth
     gradient is the same gradient). And cards passing under the mouse don't light up mid-scroll. */
  :root:is([data-skin="glass"], [data-skin="black"]) :is(.item, .ocard, .stat, .qtysum, .log, .users-btn, .theme-pick, .chip, .catbtn, .otool) {
    -webkit-backdrop-filter: none; backdrop-filter: none; }

    background: linear-gradient(100deg, transparent 10%, rgba(255, 255, 255, .8) 50%, transparent 90%); mix-blend-mode: overlay; transform: translateX(-160%) skewX(-18deg); }   /* swept now and then by epicTick() */

  /* ⏱ note timer: ▶ Start / ■ Stop store the exact date and time */
  .tl-row.k-time .tl-btns { grid-column: 1 / -1; grid-row: auto; }
  @media (max-width: 520px) { .tl-row.k-time .tl-btns { grid-row: 3; margin-left: 24px; } }
  .tl-btns { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0 2px 30px; }
  .tl-btns button { border: 0; border-radius: 999px; padding: 7px 14px; font-family: inherit; font-weight: 800; font-size: 13px; cursor: pointer; }
  .tl-go { background: #16a34a; color: #fff; } .tl-go.again { background: color-mix(in srgb, #16a34a 18%, var(--card)); color: #15803d; }
  .tl-stop { background: color-mix(in srgb, var(--text) 10%, var(--card)); color: var(--text); }
  .tl-stop.live { background: #dc2626; color: #fff; animation: tlPulse 1.6s ease-in-out infinite; }
